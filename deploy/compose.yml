name: advent

services:
  # Внутренний Caddy: портов наружу нет, TLS нет (http://challenge.zpq.ai).
  # 80, 443 и сертификаты всех четырёх имён держит вход проекта zpq
  # (приватный MikeKharr/zpq-ai), он же проксирует сюда весь хост
  # challenge.zpq.ai — ADR 2026-09-22-0611. Тома caddy_data и caddy_config
  # здесь больше не объявлены: сертификаты уехали к тому Caddy как внешние
  # тома advent_caddy_data и advent_caddy_config. Именно поэтому их не
  # тронет даже `down -v` в этом проекте.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../site:/srv/site:ro
    networks:
      # default — сеть проекта: по ней Caddy ходит в контейнеры дней.
      default:
      # edge — общая с проектом zpq: под алиасом advent сюда приходит вход.
      edge:
        aliases:
          - advent
    depends_on:
      - day1
      - day2
      - day3
      - day4
      - day5
      - day6
      - day7
      - day8
      - day9
      - day10
      - day11
      - day13
      - day14
    # Как у всех соседних служб: драйвер по умолчанию пишет без потолка и
    # без ротации — на том же одном VPS, где переполнение диска
    # останавливает учёт расхода (router/src/ledger.js).
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  day1:
    # Тег приходит из .env, который переписывает workflow деплоя.
    # Откат — поставить предыдущий sha и docker compose up -d day1.
    image: ghcr.io/mikekharr/advent-day1:${DAY1_TAG:-latest}
    restart: unless-stopped
    expose:
      - "8080"
    env_file:
      # Общее для всех дней: ключ Anthropic и лимиты. Кладётся на сервер один раз.
      - path: ./secrets.env
        required: false
      # Только то, что специфично для этого дня. Переопределяет secrets.env.
      - path: ./day1.env
        required: false
    environment:
      - NODE_ENV=production
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  day2:
    image: ghcr.io/mikekharr/advent-day2:${DAY2_TAG:-latest}
    restart: unless-stopped
    expose:
      - "8080"
    env_file:
      - path: ./secrets.env
        required: false
      - path: ./day2.env
        required: false
    environment:
      - NODE_ENV=production
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  day3:
    image: ghcr.io/mikekharr/advent-day3:${DAY3_TAG:-latest}
    restart: unless-stopped
    expose:
      - "8080"
    env_file:
      - path: ./secrets.env
        required: false
      - path: ./day3.env
        required: false
    environment:
      - NODE_ENV=production
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  day4:
    image: ghcr.io/mikekharr/advent-day4:${DAY4_TAG:-latest}
    restart: unless-stopped
    expose:
      - "8080"
    env_file:
      - path: ./secrets.env
        required: false
      - path: ./day4.env
        required: false
    environment:
      - NODE_ENV=production
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  day5:
    image: ghcr.io/mikekharr/advent-day5:${DAY5_TAG:-latest}
    restart: unless-stopped
    expose:
      - "8080"
    env_file:
      # Ключей к моделям у дня нет: он ходит в роутер по ключу приложения
      # (ROUTER_APP_KEY в day5.env, то же значение — APP_KEY_DAY5 в router.env).
      - path: ./day5.env
        required: false
    environment:
      - NODE_ENV=production
    volumes:
      - day5_data:/data   # архив статей, переживает пересоздание контейнера
    depends_on:
      - router
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  day6:
    image: ghcr.io/mikekharr/advent-day6:${DAY6_TAG:-latest}
    restart: unless-stopped
    expose:
      - "8080"
    env_file:
      # День — пульт к агенту: у него только ключ сервиса агентов
      # (AGENT_KEY в day6.env, то же значение — AGENT_KEY в agents.env).
      # Ключа роутера у дня нет: деньги тратит агент.
      - path: ./day6.env
        required: false
    environment:
      - NODE_ENV=production
    depends_on:
      - agents
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  day7:
    image: ghcr.io/mikekharr/advent-day7:${DAY7_TAG:-latest}
    restart: unless-stopped
    expose:
      - "8080"
    env_file:
      # Тот же ключ сервиса агентов, что и у дня 6: своих данных и ключей
      # к моделям у дня нет, переписка живёт у агента.
      - path: ./day7.env
        required: false
    environment:
      - NODE_ENV=production
    depends_on:
      - agents
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  day8:
    image: ghcr.io/mikekharr/advent-day8:${DAY8_TAG:-latest}
    restart: unless-stopped
    expose:
      - "8080"
    env_file:
      # Тот же ключ сервиса агентов, что у дней 6 и 7; своя cookie сессии.
      - path: ./day8.env
        required: false
    environment:
      - NODE_ENV=production
    depends_on:
      - agents
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  day9:
    image: ghcr.io/mikekharr/advent-day9:${DAY9_TAG:-latest}
    restart: unless-stopped
    expose:
      - "8080"
    env_file:
      # Тот же ключ сервиса агентов, что у дней 6–8; своя cookie сессии.
      # Сводку разговора делает агент (ADR 2026-09-11-1608): ключей к
      # моделям у дня по-прежнему нет.
      - path: ./day9.env
        required: false
    environment:
      - NODE_ENV=production
    depends_on:
      - agents
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  day10:
    image: ghcr.io/mikekharr/advent-day10:${DAY10_TAG:-latest}
    restart: unless-stopped
    expose:
      - "8080"
    env_file:
      # Тот же ключ сервиса агентов, что у дней 6–9; своя cookie сессии.
      # Стратегии памяти и ветки ведёт агент (ADR 2026-09-14-0447): ключей к
      # моделям у дня по-прежнему нет.
      - path: ./day10.env
        required: false
    environment:
      - NODE_ENV=production
    depends_on:
      - agents
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  day11:
    image: ghcr.io/mikekharr/advent-day11:${DAY11_TAG:-latest}
    restart: unless-stopped
    expose:
      - "8080"
    env_file:
      # Тот же ключ сервиса агентов, что у дней 6–10; свои cookie профиля и
      # диалога. Профили, слои памяти и темы ведёт агент
      # (ADR 2026-09-15-2024): ключей к моделям у дня по-прежнему нет.
      - path: ./day11.env
        required: false
    environment:
      - NODE_ENV=production
    depends_on:
      - agents
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Дня 12 в репозитории нет: задание пропущено (ADR 2026-09-21-1747).
  day13:
    image: ghcr.io/mikekharr/advent-day13:${DAY13_TAG:-latest}
    restart: unless-stopped
    expose:
      - "8080"
    env_file:
      # Тот же ключ сервиса агентов, что у дней 6–11; свои cookie профиля и
      # диалога. Машину состояний запуска, паузу, круг проверки и журнал
      # этапов ведёт агент staged-agent (ADR 2026-09-21-1747): ключей к
      # моделям у дня по-прежнему нет. Журнал этапов CSV пишет сервис
      # агентов на свой том agents_data, не день.
      - path: ./day13.env
        required: false
    environment:
      - NODE_ENV=production
    depends_on:
      - agents
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  day14:
    image: ghcr.io/mikekharr/advent-day14:${DAY14_TAG:-latest}
    restart: unless-stopped
    expose:
      - "8080"
    env_file:
      # Тот же ключ сервиса агентов, что у дней 6–13; свои cookie профиля и
      # диалога. Память инвариантов профиля, ворота формулировщика и проверку
      # на нарушение ведёт агент invariant-agent (ADR 2026-09-22-0827):
      # ключей к моделям у дня по-прежнему нет. Билеты формулировщика живут
      # в памяти процесса сервиса агентов — секрета для них не заводится.
      - path: ./day14.env
        required: false
    environment:
      - NODE_ENV=production
    depends_on:
      - agents
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Сервис агентов (ADR 2026-09-09-0854). Публичного адреса нет: к нему
  # ходят контейнеры дней по сети compose, http://agents:8082. Сам он ходит
  # в роутер по ключу приложения `agents`.
  agents:
    image: ghcr.io/mikekharr/advent-agents:${AGENTS_TAG:-latest}
    restart: unless-stopped
    expose:
      - "8082"
    env_file:
      # AGENT_KEY (проверяет сервис) и ROUTER_APP_KEY (предъявляет роутеру).
      # Без файла сервис падает на старте (нет секретов); дни поднимаются.
      - path: ./agents.env
        required: false
    environment:
      - NODE_ENV=production
    volumes:
      - agents_data:/data   # архив статей агента, переживает пересоздание контейнера
    depends_on:
      - router
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Роутер LLM-провайдеров (ADR 2026-09-08-1748). Публичного адреса нет:
  # к нему ходят только контейнеры дней по сети compose, http://router:8081.
  router:
    image: ghcr.io/mikekharr/advent-router:${ROUTER_TAG:-latest}
    restart: unless-stopped
    expose:
      - "8081"
    env_file:
      # Ключи провайдеров и ключи приложений живут у роутера, не у дней.
      # Не обязателен для compose: без файла роутер сам падает на старте
      # (нет секретов), а дни продолжают подниматься.
      - path: ./router.env
        required: false
    environment:
      - NODE_ENV=production
    volumes:
      - router_data:/data   # журнал расхода, переживает пересоздание контейнера
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Атлас проекта (ADR 2026-09-10-0550): статика схемы проекта, маршрут
  # /atlas/ в Caddyfile. Секретов у него нет, поэтому нет и env_file.
  atlas:
    image: ghcr.io/mikekharr/advent-atlas:${ATLAS_TAG:-latest}
    restart: unless-stopped
    expose:
      - "8080"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

# caddy_data, caddy_config, mail_etc и mail_data здесь больше не объявлены:
# их подхватывает проект zpq как внешние тома advent_caddy_data,
# advent_caddy_config, advent_mail_etc и advent_mail_data (ADR 2026-09-22-0611).
# Данные никуда не копировались и не переименовывались — переехало только то,
# кто их монтирует. Объявление снято тем же изменением, что убирает службы:
# иначе `down -v` в этом проекте удалил бы сертификаты и почту.
volumes:
  router_data:
  agents_data:
  day5_data:

# Общая сеть входа. Создаётся один раз руками: `docker network create edge`.
# Внешняя с обеих сторон, поэтому ни один из двух проектов её не удаляет.
networks:
  edge:
    external: true
