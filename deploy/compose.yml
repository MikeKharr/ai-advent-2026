name: advent

services:
  # Внутренний Caddy: портов наружу нет, TLS нет (http://challenge.zpq.ai).
  # 80, 443 и сертификаты всех четырёх имён держит вход проекта zpq
  # (приватный MikeKharr/zpq-ai), он же проксирует сюда весь хост
  # challenge.zpq.ai — ADR 2026-09-22-0611. Тома caddy_data и caddy_config
  # здесь больше не объявлены: сертификаты уехали к тому Caddy как внешние
  # тома advent_caddy_data и advent_caddy_config. Именно поэтому их не
  # тронет даже `down -v` в этом проекте.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../site:/srv/site:ro
    networks:
      # default — сеть проекта: по ней Caddy ходит в контейнеры дней.
      default:
      # mcp — отдельная сеть службы MCP (ADR 2026-09-23-1227, п. 5). Caddy в
      # ней потому, что публикует /mcp; router, agents и всё, что читает
      # secrets.env, в неё не входят — оттуда имя mcp не разрешается.
      mcp:
      # rag — сеть индекса проекта (ADR 2026-09-29-1639, п. 4). Caddy в ней
      # потому, что публикует /rag/healthz; дни, router, agents и серверы
      # инструментов в неё не входят — до эмбеддера им не дотянуться.
      rag:
      # edge — общая с проектом zpq: под алиасом advent сюда приходит вход.
      edge:
        aliases:
          - advent
    depends_on:
      - day1
      - day2
      - day3
      - day4
      - day5
      - day6
      - day7
      - day8
      - day9
      - day10
      - day11
      - day13
      - day14
      - day15
      - day16
      - day18
      - day19
      - day20
      - mcp
      - rag
    # Как у всех соседних служб: драйвер по умолчанию пишет без потолка и
    # без ротации — на том же одном VPS, где переполнение диска
    # останавливает учёт расхода (router/src/ledger.js).
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  day1:
    # Тег приходит из .env, который переписывает workflow деплоя.
    # Откат — поставить предыдущий sha и docker compose up -d day1.
    image: ghcr.io/mikekharr/advent-day1:${DAY1_TAG:-latest}
    restart: unless-stopped
    expose:
      - "8080"
    env_file:
      # Общее для всех дней: ключ Anthropic и лимиты. Кладётся на сервер один раз.
      - path: ./secrets.env
        required: false
      # Только то, что специфично для этого дня. Переопределяет secrets.env.
      - path: ./day1.env
        required: false
    environment:
      - NODE_ENV=production
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  day2:
    image: ghcr.io/mikekharr/advent-day2:${DAY2_TAG:-latest}
    restart: unless-stopped
    expose:
      - "8080"
    env_file:
      - path: ./secrets.env
        required: false
      - path: ./day2.env
        required: false
    environment:
      - NODE_ENV=production
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  day3:
    image: ghcr.io/mikekharr/advent-day3:${DAY3_TAG:-latest}
    restart: unless-stopped
    expose:
      - "8080"
    env_file:
      - path: ./secrets.env
        required: false
      - path: ./day3.env
        required: false
    environment:
      - NODE_ENV=production
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  day4:
    image: ghcr.io/mikekharr/advent-day4:${DAY4_TAG:-latest}
    restart: unless-stopped
    expose:
      - "8080"
    env_file:
      - path: ./secrets.env
        required: false
      - path: ./day4.env
        required: false
    environment:
      - NODE_ENV=production
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  day5:
    image: ghcr.io/mikekharr/advent-day5:${DAY5_TAG:-latest}
    restart: unless-stopped
    expose:
      - "8080"
    env_file:
      # Ключей к моделям у дня нет: он ходит в роутер по ключу приложения
      # (ROUTER_APP_KEY в day5.env, то же значение — APP_KEY_DAY5 в router.env).
      - path: ./day5.env
        required: false
    environment:
      - NODE_ENV=production
    volumes:
      - day5_data:/data   # архив статей, переживает пересоздание контейнера
    depends_on:
      - router
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  day6:
    image: ghcr.io/mikekharr/advent-day6:${DAY6_TAG:-latest}
    restart: unless-stopped
    expose:
      - "8080"
    env_file:
      # День — пульт к агенту: у него только ключ сервиса агентов
      # (AGENT_KEY в day6.env, то же значение — AGENT_KEY в agents.env).
      # Ключа роутера у дня нет: деньги тратит агент.
      - path: ./day6.env
        required: false
    environment:
      - NODE_ENV=production
    depends_on:
      - agents
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  day7:
    image: ghcr.io/mikekharr/advent-day7:${DAY7_TAG:-latest}
    restart: unless-stopped
    expose:
      - "8080"
    env_file:
      # Тот же ключ сервиса агентов, что и у дня 6: своих данных и ключей
      # к моделям у дня нет, переписка живёт у агента.
      - path: ./day7.env
        required: false
    environment:
      - NODE_ENV=production
    depends_on:
      - agents
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  day8:
    image: ghcr.io/mikekharr/advent-day8:${DAY8_TAG:-latest}
    restart: unless-stopped
    expose:
      - "8080"
    env_file:
      # Тот же ключ сервиса агентов, что у дней 6 и 7; своя cookie сессии.
      - path: ./day8.env
        required: false
    environment:
      - NODE_ENV=production
    depends_on:
      - agents
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  day9:
    image: ghcr.io/mikekharr/advent-day9:${DAY9_TAG:-latest}
    restart: unless-stopped
    expose:
      - "8080"
    env_file:
      # Тот же ключ сервиса агентов, что у дней 6–8; своя cookie сессии.
      # Сводку разговора делает агент (ADR 2026-09-11-1608): ключей к
      # моделям у дня по-прежнему нет.
      - path: ./day9.env
        required: false
    environment:
      - NODE_ENV=production
    depends_on:
      - agents
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  day10:
    image: ghcr.io/mikekharr/advent-day10:${DAY10_TAG:-latest}
    restart: unless-stopped
    expose:
      - "8080"
    env_file:
      # Тот же ключ сервиса агентов, что у дней 6–9; своя cookie сессии.
      # Стратегии памяти и ветки ведёт агент (ADR 2026-09-14-0447): ключей к
      # моделям у дня по-прежнему нет.
      - path: ./day10.env
        required: false
    environment:
      - NODE_ENV=production
    depends_on:
      - agents
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  day11:
    image: ghcr.io/mikekharr/advent-day11:${DAY11_TAG:-latest}
    restart: unless-stopped
    expose:
      - "8080"
    env_file:
      # Тот же ключ сервиса агентов, что у дней 6–10; свои cookie профиля и
      # диалога. Профили, слои памяти и темы ведёт агент
      # (ADR 2026-09-15-2024): ключей к моделям у дня по-прежнему нет.
      - path: ./day11.env
        required: false
    environment:
      - NODE_ENV=production
    depends_on:
      - agents
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Дня 12 в репозитории нет: задание пропущено (ADR 2026-09-21-1747).
  day13:
    image: ghcr.io/mikekharr/advent-day13:${DAY13_TAG:-latest}
    restart: unless-stopped
    expose:
      - "8080"
    env_file:
      # Тот же ключ сервиса агентов, что у дней 6–11; свои cookie профиля и
      # диалога. Машину состояний запуска, паузу, круг проверки и журнал
      # этапов ведёт агент staged-agent (ADR 2026-09-21-1747): ключей к
      # моделям у дня по-прежнему нет. Журнал этапов CSV пишет сервис
      # агентов на свой том agents_data, не день.
      - path: ./day13.env
        required: false
    environment:
      - NODE_ENV=production
    depends_on:
      - agents
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  day14:
    image: ghcr.io/mikekharr/advent-day14:${DAY14_TAG:-latest}
    restart: unless-stopped
    expose:
      - "8080"
    env_file:
      # Тот же ключ сервиса агентов, что у дней 6–13; свои cookie профиля и
      # диалога. Память инвариантов профиля, ворота формулировщика и проверку
      # на нарушение ведёт агент invariant-agent (ADR 2026-09-22-0827):
      # ключей к моделям у дня по-прежнему нет. Билеты формулировщика живут
      # в памяти процесса сервиса агентов — секрета для них не заводится.
      - path: ./day14.env
        required: false
    environment:
      - NODE_ENV=production
    depends_on:
      - agents
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  day15:
    image: ghcr.io/mikekharr/advent-day15:${DAY15_TAG:-latest}
    restart: unless-stopped
    expose:
      - "8080"
    env_file:
      # Тот же ключ сервиса агентов, что у дней 6–14; свои cookie профиля и
      # диалога. Каталог дня заведён копией дня 14 (ADR 2026-09-23-0646):
      # промпты профиля, этап подготовки промпта и потолок 32 000 приезжают
      # следующим PR, до него день работает как день 14 на своём адресе.
      # Ключей к моделям у дня нет.
      - path: ./day15.env
        required: false
    environment:
      - NODE_ENV=production
    depends_on:
      - agents
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # День 16 — консоль MCP (ADR 2026-09-23-1227, п. 7). Ключей к моделям,
  # ключа роутера и ключа сервиса агентов у дня нет: он ходит ТОЛЬКО в службу
  # MCP по http://mcp:8083/mcp и предъявляет ей её же ключ MCP_KEY.
  #
  # Сеть — только mcp, как у самой службы. В default дню делать нечего: ни к
  # роутеру, ни к агентам он не обращается, и держать его рядом с secrets.env
  # значило бы отдать сети то, что не нужно для работы.
  day16:
    image: ghcr.io/mikekharr/advent-day16:${DAY16_TAG:-latest}
    restart: unless-stopped
    expose:
      - "8080"
    env_file:
      # MCP_KEY — копия значения из mcp.env (ADR 2026-09-11-1743, норма копии
      # между env-файлами). Без файла день поднимается, страница отдаётся, но
      # /healthz отвечает 503 — проверять настройку по нему, не по «up».
      - path: ./day16.env
        required: false
    environment:
      - NODE_ENV=production
    networks:
      - mcp
    depends_on:
      - mcp
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Дни 18–20 (ADR 2026-09-28-0736, пп. 6, 8, 9). Тот же ключ сервиса агентов,
  # что у дней 6–15, и больше ничего: ключей к моделям и ключа роутера у них
  # нет, всю работу и весь расход ведёт agents. Своих данных на диске нет —
  # томов нет: сводки дня 18 живут в jobs.db на томе agents_data, файлы дня 19
  # — на томе mcpstore_data.
  day18:
    image: ghcr.io/mikekharr/advent-day18:${DAY18_TAG:-latest}
    restart: unless-stopped
    expose:
      - "8080"
    env_file:
      - path: ./day18.env
        required: false
    environment:
      - NODE_ENV=production
    depends_on:
      - agents
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  day19:
    image: ghcr.io/mikekharr/advent-day19:${DAY19_TAG:-latest}
    restart: unless-stopped
    expose:
      - "8080"
    env_file:
      - path: ./day19.env
        required: false
    environment:
      - NODE_ENV=production
    depends_on:
      - agents
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # У дня 20 порядок вызовов выбирает модель, поэтому он единственный из трёх
  # тратит на посетителя: MAX_DAILY_CALLS 50 — его собственный потолок
  # (days/day20/env.js), поверх суточного потолка приложения в роутере.
  day20:
    image: ghcr.io/mikekharr/advent-day20:${DAY20_TAG:-latest}
    restart: unless-stopped
    expose:
      - "8080"
    env_file:
      - path: ./day20.env
        required: false
    environment:
      - NODE_ENV=production
    depends_on:
      - agents
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Сервис агентов (ADR 2026-09-09-0854). Публичного адреса нет: к нему
  # ходят контейнеры дней по сети compose, http://agents:8082. Сам он ходит
  # в роутер по ключу приложения `agents`.
  agents:
    image: ghcr.io/mikekharr/advent-agents:${AGENTS_TAG:-latest}
    restart: unless-stopped
    expose:
      # 8082 — API экранов дней под AGENT_KEY.
      - "8082"
      # 8086 — поверхность управления инструментами агентов под CONTROL_KEY
      # (ADR 2026-09-28-1820, п. 1). Второй слушатель ТОГО ЖЕ процесса, а не
      # отдельная единица: под операциями те же функции хранилища и агента
      # изнутри процесса, а файл SQLite между контейнерами не делится.
      #
      # Маршрута в Caddyfile у этого порта НЕТ (п. 7), и потому снаружи он
      # недостижим. Честно о том, чего это не значит: отсутствие маршрута не
      # держит НИЧТО — это не свойство проекта, а текущее состояние файла.
      # Единственная преграда к поверхности — ключ (решение владельца).
      - "8086"
    env_file:
      # AGENT_KEY (проверяет сервис) и ROUTER_APP_KEY (предъявляет роутеру).
      # CONTROL_KEY — ключ поверхности управления; без него она выключена.
      # MCP_KEY — копия значения из mcp.env: им хост предъявляется службе
      # дня 16 (ADR 2026-09-29-0236, п. 8). Третья копия после mcp.env и
      # day16.env; ротация — три файла и три контейнера.
      # Без файла сервис падает на старте (нет секретов); дни поднимаются.
      - path: ./agents.env
        required: false
    environment:
      - NODE_ENV=production
      # Адреса серверов MCP этого проекта. Не секреты: имена mcpnews и
      # mcpstore разрешаются только внутри сети tools, публичного адреса у
      # них нет; адрес службы дня 16 — внутреннее имя её контейнера, тогда
      # как наружу она ходит через Caddy и свой ключ.
      # Поэтому здесь, а не в agents.env: файл на сервере правится руками,
      # в ревью не виден и выкаткой не едет, а compose.yml едет из
      # репозитория и виден в диффе. environment перекрывает env_file, так
      # что забытое старое значение в agents.env эти строки не заслонит.
      #
      # Без них loadServers (agents/src/mcp/servers.js) кладёт сервер в
      # skipped МОЛЧА, и работа планировщика возвращает «инструментов нет»
      # при живых контейнерах. Держит test/mcp-server-urls.test.js: он
      # выводит ожидаемый адрес из порта в mcpnews/server.js, пути MCP_PATH
      # в src/service.js и сети tools в этом же файле — переписать значение
      # мимо источника нельзя.
      #
      # MCP_DAY16_URL — служба дня 16 третьим сервером (ADR 2026-09-29-0236,
      # п. 5). Решение принято: `agents` входит в сеть `mcp` (см. networks
      # ниже), поэтому имя `mcp` отсюда разрешается. Алиас входа не нужен —
      # ходим прямо к контейнеру службы, минуя Caddy, как это делает день 16.
      # Адрес тоже не секрет: наружу служба публикуется отдельно, Caddyfile.
      # Ключ к ней — MCP_KEY, и он ЗДЕСЬ НЕ СТОИТ: это секрет, его место в
      # agents.env копией из mcp.env (ADR 2026-09-11-1743, норма копии).
      # Без ключа служба отвечает хосту как несуществующий путь, day16
      # попадает в `unreachable`, а дни 6–20 работают дальше.
      #
      # MCP_RAG_URL — служба индекса проекта четвёртым сервером (ADR
      # 2026-10-04-0735, п. 1), её зовёт агент дня 22. Решение принято:
      # `agents` входит в сеть `rag` (см. networks ниже), поэтому имя `rag`
      # отсюда разрешается. Идём прямо к контейнеру службы, минуя Caddy:
      # наружу она публикуется отдельно (Caddyfile, `/rag`), и выход через
      # вход zpq и обратно — лишний путь. Адрес не секрет; ключ к ней —
      # RAG_KEY, и он ЗДЕСЬ НЕ СТОИТ: это секрет, его место в agents.env
      # копией из rag.env (закрытый список /day-cycle). Без ключа служба
      # отвечает хосту как несуществующий путь, поиск отказывает, и день 22
      # говорит «поиск недоступен» — модель при этом не вызывается.
      - MCP_NEWS_URL=http://mcpnews:8084/mcp
      - MCP_STORE_URL=http://mcpstore:8085/mcp
      - MCP_DAY16_URL=http://mcp:8083/mcp
      - MCP_RAG_URL=http://rag:8086/rag
    volumes:
      - agents_data:/data   # архив статей агента, переживает пересоздание контейнера
    networks:
      # default — как и раньше: по ней приходят дни 6–15 и уходит запрос в
      # роутер. Ключ networks: появился только из-за cron: без него служба
      # оказалась бы ТОЛЬКО в сети cron, и дни потеряли бы её молча.
      default:
      # cron — сеть на двоих с контейнером времени (ADR 2026-09-28-0736,
      # п. 6). Она нужна не для связности: связность дал бы и default. Она
      # нужна, чтобы у cron не было пути ни к router, ни к дням, ни к mcp —
      # из неё не разрешается даже их имя. Держит
      # .github/scripts/compose-networks.mjs.
      cron:
      # tools — сеть серверов MCP дней 19–20 (ADR 2026-09-28-0736, п. 3).
      # Отдельная по той же причине: хост ходит к ним, они не ходят никуда.
      # caddy в неё не входит — маршрута в Caddyfile у этих серверов нет и
      # публичного адреса тоже.
      tools:
      # mcp — сеть службы дня 16 (ADR 2026-09-29-0236, п. 5). Названная там
      # цена: сеть `mcp` ПЕРЕСТАЁТ быть отрезанной от `agents`. Из неё теперь
      # разрешается имя `agents`, то есть порты 8082 и 8086 достижимы, и
      # держат их только AGENT_KEY и CONTROL_KEY, а не устройство сети.
      # `router` и всё, что читает secrets.env, по-прежнему вне досягаемости:
      # они в default, а службы `mcp` там нет.
      mcp:
      # rag — сеть индекса проекта (ADR 2026-10-04-0735, п. 1). Цена названа
      # там же и прямо: сеть `rag` ПЕРЕСТАЁТ быть отрезанной от `agents`.
      # Из неё теперь разрешается имя `agents`, а из `agents` — имена `rag` и
      # `ollama`, то есть единица с деревом npm дотягивается до `ollama:11434`
      # напрямую, минуя ключ, лимитер и суточный потолок службы `rag`.
      # Прежнее обещание «ни дни, ни router, ни agents сюда не входят» про
      # `agents` больше не действует; про остальных — действует.
      #
      # Обратное направление названо отдельно, потому что оно тоже есть
      # (находка `compliance`, PR #302): из сети `rag` разрешается имя
      # `agents`, то есть `ollama` — третья сторона без ключа и без
      # лимитера — получает сетевой доступ к портам 8082 и 8086 пульта,
      # который сидит ещё в `default`, `mcp`, `tools` и `cron`. Держат их
      # только AGENT_KEY и CONTROL_KEY, а не устройство сети: это потеря
      # эшелона, а не открытая дверь.
      rag:
    depends_on:
      - router
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Время планировщика дня 18 (ADR 2026-09-28-0736, п. 6). Контейнер решает
  # ТОЛЬКО «когда»: по расписанию из git он дёргает ручку запуска работы в
  # сервисе агентов. Решение «запускать ли сейчас» — включена ли работа, не
  # идёт ли предыдущий запуск, не занят ли этот час, не исчерпан ли суточный
  # потолок стартов, есть ли ключ приложения scheduler — принимает сервис
  # агентов; состояние (jobs.db) и трейс тоже у него.
  #
  # Почему контейнер, а не crontab хоста: хостовой crontab лежит вне
  # репозитория, не едет выкаткой, правится только по ssh и не виден с
  # экрана. Каденция здесь — поле scheduleUtc работы в
  # agents/config/jobs.json, и это её единственный адрес: тот же файл читает
  # сервис агентов, когда показывает экрану дня 18 «следующий срок».
  # Таблицу для crond собирает из него deploy/cron/crontab.sh на старте.
  #
  # Образ стоковый и закреплён тегом И digest (образец — caddy в zpq-ai):
  # alpine:3.24.2 — движущаяся цель, и смена busybox под тем же тегом меняла
  # бы поведение crond и wget без единой строки диффа. Обновление — отдельным
  # PR, как у любого пина. Digest сверен с registry-1.docker.io 2026-09-28.
  #
  # Dockerfile у службы нет, и это осознанно: без каталога с Dockerfile она
  # не единица выкатки (deploy-units.sh, ci.yml), поэтому её не знают ни
  # матрица сборки, ни ожидание healthy, ни «Проверка живого сайта», которой
  # нечего дёргать у контейнера без публичного адреса. Поднимает её тот же
  # `docker compose up -d`, что и caddy, живущий так с первого дня.
  cron:
    image: alpine:3.24.2@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
    restart: unless-stopped
    env_file:
      # AGENT_KEY — копия значения из agents.env (норма копии между
      # env-файлами, ADR 2026-09-11-1743). Без файла контейнер не
      # поднимается: entrypoint отказывает на старте. Иначе вышел бы
      # контейнер, который раз в 6 часов получает 401 и при этом выглядит
      # работающим планировщиком.
      - path: ./cron.env
        required: false
    volumes:
      # Скрипты контейнера времени — на чтение: entrypoint, сборка таблицы и
      # тик. Таблицы в этом каталоге больше нет, она собирается на старте.
      - ./cron:/cron:ro
      # Единственный источник каденции. Файл тот же, что уезжает в образ
      # сервиса агентов, поэтому «когда» у контейнера времени и «следующий
      # срок» на экране дня 18 берутся из одной строки и разойтись не могут.
      # Отдельной точкой монтирования, а не внутрь /cron: /cron примонтирован
      # на чтение, и вложить в него файл нечем.
      #
      # Таблица собирается на старте, поэтому новая каденция доезжает
      # пересозданием этого контейнера — его делает шаг выкатки после
      # `docker compose up -d` (.github/workflows/deploy.yml).
      - ../agents/config/jobs.json:/jobs.json:ro
    tmpfs:
      # /run/agent.key и /run/crontabs/root пишет entrypoint: ключ и
      # собранная таблица существуют только в памяти контейнера и не
      # попадают в его записываемый слой на диске.
      - /run:mode=0755
    command: ["/bin/sh", "/cron/entrypoint.sh"]
    networks:
      - cron
    depends_on:
      - agents
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Роутер LLM-провайдеров (ADR 2026-09-08-1748). Публичного адреса нет:
  # к нему ходят только контейнеры дней по сети compose, http://router:8081.
  router:
    image: ghcr.io/mikekharr/advent-router:${ROUTER_TAG:-latest}
    restart: unless-stopped
    expose:
      - "8081"
    env_file:
      # Ключи провайдеров и ключи приложений живут у роутера, не у дней.
      # Не обязателен для compose: без файла роутер сам падает на старте
      # (нет секретов), а дни продолжают подниматься.
      - path: ./router.env
        required: false
    environment:
      - NODE_ENV=production
    volumes:
      - router_data:/data   # журнал расхода, переживает пересоздание контейнера
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Служба MCP (ADR 2026-09-23-1227). Публичный адрес — /mcp на входе адвента,
  # вход по Bearer MCP_KEY; /mcp/healthz открыт для выкатки.
  #
  # Сеть — только mcp, и это по-прежнему защита устройством, но защищает она
  # теперь меньше: ключей к моделям и ключа роутера у службы нет, в сети
  # default её нет — оттуда не разрешается даже имя `router` и ничто из
  # читающего secrets.env. А вот `agents` с ADR 2026-09-29-0236, п. 5, в сети
  # `mcp` стоит, и единственная единица проекта с деревом npm до его портов
  # 8082 и 8086 дотягивается: их держат AGENT_KEY и CONTROL_KEY.
  mcp:
    image: ghcr.io/mikekharr/advent-mcp:${MCP_TAG:-latest}
    restart: unless-stopped
    expose:
      - "8083"
    env_file:
      # MCP_KEY — единственный секрет службы. Без файла служба падает на
      # старте (нет секрета); дни и остальные службы поднимаются.
      - path: ./mcp.env
        required: false
    environment:
      - NODE_ENV=production
      # Окна лимитера службы. Что они считают, зависит от пути, и держит
      # это одна строка в deploy/Caddyfile: `header_up X-Forwarded-For
      # {client_ip}` в блоке /mcp. Caddy не дописывает заголовок, а ЗАМЕНЯЕТ
      # его, поэтому подделать адрес снаружи нельзя, а мимо Caddy до службы
      # не достучаться — портов наружу нет, сеть mcp отдельная.
      #   - публичный /mcp: адрес настоящий, окно поадресное;
      #   - консоль дня 16: день не передаёт X-Forwarded-For, служба видит
      #     адрес его контейнера — одно общее окно на всю консоль;
      #   - хост агентов (день 20 и всё, что пойдёт следом): тоже без
      #     X-Forwarded-For, тоже одно общее окно на адрес контейнера
      #     `agents` — ОТДЕЛЬНОЕ от окна консоли, потому что адрес другой
      #     (ADR 2026-09-29-0236, «Одно окно лимитера службы на весь хост»).
      # Поадресную защиту консоли даёт лимитер самого дня
      # (RATE_LIMIT_PER_MIN=20 на посетителя, days/day16/env.js); он же
      # держит сверху потолок исходящего трафика к Open-Meteo и Википедии.
      # Числа ниже выбраны так, чтобы показ в них не упирался, а залп
      # упирался: умолчания службы (10 и 100) малы для общего окна консоли —
      # два человека сразу получали бы 429 из-за показа.
      - RATE_LIMIT_PER_MIN=60
      - RATE_LIMIT_PER_HOUR=600
    networks:
      - mcp
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Серверы MCP дней 19–20 (ADR 2026-09-28-0736, п. 3). Публичного адреса нет,
  # маршрута в Caddyfile нет, ключей нет вовсе: к ним ходит только хост в
  # agents по сети tools, а платный API они не вызывают. Каждый несёт свою
  # копию модуля JSON-RPC — пакетов ноль, граница ADR 2026-09-23-1227 цела.
  mcpnews:
    image: ghcr.io/mikekharr/advent-mcpnews:${MCPNEWS_TAG:-latest}
    restart: unless-stopped
    expose:
      - "8084"
    environment:
      - NODE_ENV=production
    networks:
      - tools
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  mcpstore:
    image: ghcr.io/mikekharr/advent-mcpstore:${MCPSTORE_TAG:-latest}
    restart: unless-stopped
    expose:
      - "8085"
    environment:
      - NODE_ENV=production
    volumes:
      # Файлы дня 19 живут 30 часов и переживают пересоздание контейнера;
      # выкатка именованных томов не трогает.
      - mcpstore_data:/data
    networks:
      - tools
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Атлас проекта (ADR 2026-09-10-0550): статика схемы проекта, маршрут
  # /atlas/ в Caddyfile. Секретов у него нет, поэтому нет и env_file.
  atlas:
    image: ghcr.io/mikekharr/advent-atlas:${ATLAS_TAG:-latest}
    restart: unless-stopped
    expose:
      - "8080"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # --- индекс проекта на эмбеддингах (день 21, ADR 2026-09-29-1639) ---
  #
  # Две службы и своя сеть `rag`: в ней только caddy, rag и ollama. Дни,
  # router, agents и серверы инструментов в неё не входят — до эмбеддера им
  # не дотянуться, и держит это сеть, а не отсутствие строки в Caddyfile.
  #
  # Потолки памяти и ядер стоят ТОЛЬКО у этих двух служб (ADR, п. 4). У
  # остальных контейнеров их нет — это отдельный пункт бэклога владельцу, и
  # он не предусловие: риск от неограниченных соседей есть и сегодня, а
  # растёт он от новых жильцов, которые здесь как раз ограничены.
  ollama:
    # По digest, а не по тегу: тег переезжает молча. Это 0.35.0; слой
    # linux/amd64 — 3,75 ГБ сжатого, самый большой предмет на диске машины.
    #
    # Отступление от правила «приложение работает не от root», названное, а не
    # умолчанное: в конфигурации образа `User` пуст, ENTRYPOINT — /bin/ollama,
    # то есть служба идёт от root внутри контейнера. Своего Dockerfile у неё
    # нет — образ чужой и берётся как есть, как caddy:2-alpine и alpine у
    # контейнера времени. Переселить процесс можно только своим образом или
    # `user:` с переносом OLLAMA_MODELS, и ни то ни другое в этом заходе не
    # проверялось. Смягчающее: сеть у службы отдельная, портов наружу нет,
    # секретов в ней нет, том один.
    image: ollama/ollama@sha256:2a6e883b917fc543389599dae79918f5cac9e1438890506982f44aa4f5625d01
    restart: unless-stopped
    expose:
      - "11434"
    environment:
      # Умолчания образа названы явно: их смена в новой версии образа иначе
      # двигала бы расход памяти молча, а потолок ниже посчитан под них.
      #   KEEP_ALIVE — после 5 минут простоя модель выгружается, и ночью эти
      #   два гигабайта машине возвращаются.
      #   MAX_LOADED_MODELS и NUM_PARALLEL — один слот на одну модель: память
      #   под контекст выделяется на слот, и второй слот удвоил бы самую
      #   большую часть расхода.
      - OLLAMA_KEEP_ALIVE=5m
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_PARALLEL=1
    volumes:
      # Веса модели: 622 МБ, тянутся один раз при первом старте rag через
      # /api/pull и переживают пересоздание контейнера.
      - ollama_data:/root/.ollama
    networks:
      - rag
    # Потолок 4096 МиБ — ADR 2026-10-02-1519, правит п. 4 ADR 2026-09-29-1639.
    # Прежние 2048 МиБ убили раннер llama.cpp на худшем чанке structural
    # (1843 токена): журнал ollama — `signal: killed`, cgroup-OOM. Замер на
    # macOS/Metal (1150 МиБ у q4_0 на 3400 знаках) занижал расход на linux/amd64
    # более чем в 2048/1150 = 1,78 раза (нижняя граница: OOM говорит «больше
    # потолка», не «насколько») — опасение compliance к #281 подтвердилось.
    # Число ВЫВЕДЕНО, а не замерено: вдвое выше потолка, на котором упало; на 8 ГБ машине
    # вместе с rag это 4608 из ~6500 свободных (свободное тоже расчётное).
    # Если раннер умрёт и на 4096 — журнал ollama покажет `signal: killed` и
    # task.n_tokens входа, и число надо поднимать новым решением.
    mem_limit: 4g
    # Не ограничение скорости, а обещание соседям: сборка индекса никогда не
    # займёт оба ядра машины, второе остаётся дням.
    cpus: 1.0
    # При нехватке памяти ядро выбирает жертвой нового жильца, а не дни.
    oom_score_adj: 500
    # Признак готовности — для ГЛАЗ, а не для автоматики, и прежняя редакция
    # этого комментария врала, называя его защитой (находка `reviewer`, Б1).
    # Никто его не читает: у rag ниже короткая форма depends_on (порядок
    # старта, не здоровье), `condition: service_healthy` в этом файле не
    # встречается, `up -d` в deploy.yml идёт без `--wait`, а цикл ожидания
    # healthy службу ollama исключает — у неё нет Dockerfile, она не единица
    # выкатки.
    #
    # `condition: service_healthy` сознательно НЕ подключён. Он бы закрыл
    # гонку старта, но ценой хуже отказа: неисправный эмбеддер обрывал бы
    # `docker compose up -d` целиком, то есть краснил бы выкатку ВСЕХ единиц,
    # включая дни, которые до него не дотягиваются и от него не зависят.
    # Гонку старта держит не этот признак, а ожидание внутри самой единицы —
    # `wait_ready` в rag/build.py, под тестами WaitForEmbedderTest.
    #
    # Тогда зачем он тут: `docker compose ps` и `docker inspect` показывают
    # состояние службы, у которой нет ни публичного адреса, ни строки в
    # матрице выкатки. Без него единственным способом отличить «поднимается»
    # от «сломан» был бы журнал. Проверка изнутри контейнера, без сети наружу.
    # `ollama list` при этом не равен готовности /api/embed — он говорит
    # только, что слушатель отвечает.
    healthcheck:
      test: ["CMD-SHELL", "ollama list > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Единица rag: корпус в образе, векторы в томе, /rag/healthz и /rag на
  # входе. Инструменты MCP за ключом RAG_KEY — ADR 2026-09-29-2139.
  rag:
    image: ghcr.io/mikekharr/advent-rag:${RAG_TAG:-latest}
    restart: unless-stopped
    expose:
      - "8086"
    env_file:
      # RAG_KEY — ключ входа на /rag. required: false — РЕШЕНИЕ ВЛАДЕЛЬЦА
      # 2026-09-30, подтверждённое повторно и с знанием возражения
      # compliance; оно заменяет `required: true` из ADR 2026-09-29-2139,
      # п. 1. Не решение реализующего агента и не решение ревьюера.
      #
      # Почему не true. required: true — ошибка РАЗБОРА файла, а не отказ
      # одной службы: deploy.yml поднимает весь проект одной командой
      # `docker compose up -d`, поэтому отсутствие deploy/rag.env на сервере
      # валило бы выкатку ВСЕХ единиц. Остальные env-файлы проекта стоят
      # required: false именно поэтому.
      #
      # Возражение compliance («false даёт тихий отказ при зелёной
      # выкатке») ПРОВЕРЕНО ПО КОДУ и не подтвердилось для этого мержа:
      #   - deploy.yml:269 — `for svc in router agents mcp mcpnews mcpstore
      #     rag` с отбором `grep -q "\"$svc\""`, то есть ожидание healthy
      #     покрывает единицы, ИЗМЕНЁННЫЕ этой выкаткой;
      #   - .github/scripts/deploy-units.sh:65 — регулярка rag включает
      #     `rag/`, `deploy/`, `.github/`, `agent_docs/`, `test/`, и правка
      #     этой единицы всегда попадает в список выкатки;
      #   - без ключа процесс выходит с кодом 2, контейнер перезапускается,
      #     healthy не наступает, и deploy.yml:277 печатает
      #     `docker compose logs --tail 50 rag` и делает exit 1.
      # То есть отказ красный и с точной причиной в журнале, а не зелёный.
      # Разница с true не в громкости, а в радиусе: там не выкатывается
      # ничего, здесь не поднимается только rag.
      #
      # Остаточная правда в возражении есть: выкатка, вовсе не задевающая
      # rag (правка только days/dayN/ или site/), в список его не включит и
      # мёртвого rag не заметит. Окно узкое — регулярка ловит почти всё
      # дерево, — но оно есть, и оно записано в rag/README.md, «Что
      # остаётся непроверенным».
      #
      # Открытой ручки не бывает ни при каком значении этого флага: замок —
      # отказ старта в rag/serve.py, main, а не строка здесь.
      - path: ./rag.env
        required: false
    environment:
      - OLLAMA_URL=http://ollama:11434
      # Квантованная (QAT — обучение с учётом квантизации), а не сжатая после.
      # Замер на локальной связке: пик 1150 МиБ против 1442 у bf16 при входе
      # 3400 знаков, скорость та же до сотых, вектор те же 768 (ADR
      # 2026-09-30-0957). Тег обязателен: без него Ollama подставит `:latest`,
      # и уже лежащие в томе веса bf16 сойдут за эту модель.
      - RAG_MODEL=embeddinggemma:300m-qat-q4_0
      # Потолок на проход сборки целиком, а не на вызов. Без него зависший
      # эмбеддер держал бы проход до 31 часа на стратегию: срок есть у
      # запроса (600 с), а вызовов на стратегию 188. Число — не замер
      # VPS, а граница: локальный полный проход занял 278 с, на одном ядре
      # VPS ожидаются часы (rag/README.md, «Что остаётся непроверенным»).
      - RAG_BUILD_TIMEOUT_SECONDS=43200
      # Суточный потолок вызовов эмбеддинга запроса (сутки по UTC, счёт в
      # /data/usage.json). ЧИСЛО НЕ ИЗМЕРЕНО: сколько стоит один эмбеддинг
      # на одном ядре VPS — не мерено ни разу, и 500 взято как начальное.
      # Поправить его должны первые сутки работы: смотреть daily.used в
      # project.status на конец суток UTC и время ответа project.search во
      # время сборки. Промах в меньшую сторону останавливает поиск до
      # полуночи UTC — и это видно в отказе инструмента, а не молча.
      - RAG_DAILY_EMBEDS=500
    volumes:
      # Векторы по sha256 чанка. Том — чтобы дельта мержа была минутами, а не
      # повторной полной сборкой; выкатка именованных томов не трогает.
      - rag_data:/data
    networks:
      - rag
    depends_on:
      - ollama
    # Замер полного прохода на локальной связке: пик 146 МиБ (3009 чанков,
    # faiss + numpy + метаданные). Потолок 512 МиБ из ADR — запас втрое.
    mem_limit: 512m
    cpus: 0.5
    oom_score_adj: 500
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

# caddy_data, caddy_config, mail_etc и mail_data здесь больше не объявлены:
# их подхватывает проект zpq как внешние тома advent_caddy_data,
# advent_caddy_config, advent_mail_etc и advent_mail_data (ADR 2026-09-22-0611).
# Данные никуда не копировались и не переименовывались — переехало только то,
# кто их монтирует. Объявление снято тем же изменением, что убирает службы:
# иначе `down -v` в этом проекте удалил бы сертификаты и почту.
volumes:
  router_data:
  agents_data:
  day5_data:
  mcpstore_data:
  ollama_data:
  rag_data:

# Общая сеть входа. Создаётся один раз руками: `docker network create edge`.
# Внешняя с обеих сторон, поэтому ни один из двух проектов её не удаляет.
networks:
  edge:
    external: true
  # Сеть службы MCP: в ней caddy, mcp, day16 — его консоль — и agents,
  # хост инструментов дня 20 (ADR 2026-09-29-0236, п. 5). Отдельная, а не
  # default, — ADR 2026-09-23-1227, п. 5; но «отрезана от agents» про неё
  # больше не говорится: это и есть цена третьего сервера.
  mcp:
  # Сеть планировщика: в ней только agents и cron (ADR 2026-09-28-0736, п. 6).
  # Отдельная по той же причине, что mcp: контейнеру времени нечего мочь,
  # кроме одного стука в одну ручку.
  cron:
  # Сеть серверов MCP дней 19–20: в ней только agents, mcpnews и mcpstore
  # (ADR 2026-09-28-0736, п. 3). caddy в неё не входит: публикация этих
  # серверов наружу не предусмотрена, и сеть — то, чем это держится.
  tools:
  # Сеть индекса проекта: в ней caddy, rag, ollama и — с дня 22 — agents
  # (ADR 2026-09-29-1639, п. 4; состав расширен ADR 2026-10-04-0735, п. 1).
  # Ни дни, ни router, ни серверы инструментов сюда не входят — имя ollama у
  # них не разрешается вовсе. Про `agents` это больше не так, и это названная
  # цена потребителя поиска: хост агентов видит и `rag`, и `ollama`, а
  # эмбеддер закрыт от него только тем, что хост зовёт не его, а
  # `project.search` с ключом.
  rag:
