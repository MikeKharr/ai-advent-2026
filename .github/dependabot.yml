# Единственное дерево npm в проекте — единица mcp (ADR 2026-09-23-1227, п. 2).
# Остальные единицы зависимостей не имеют, и следить там не за чем.
#
# Только уведомление: PR от бота — повод посмотреть, а не выкатить. Поднятие
# версии SDK — отдельный PR класса A с гейтом compliance, по образцу пина
# инструмента атласа (ADR 2026-09-12-0440, раздел 4); версия в package.json
# точная, и это проверяет шаг «Граница runtime-зависимостей» в ci.yml.
version: 2
updates:
  - package-ecosystem: npm
    directory: /mcp
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
