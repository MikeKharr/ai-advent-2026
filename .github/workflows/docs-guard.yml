name: docs-guard

on:
  # edited — чтобы исправленное описание PR само перекрашивало гейт защищённых
  # путей: иначе зелёного пришлось бы добиваться пустым коммитом.
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

# Правка описания PR перезапускает гейт целиком, включая клон инструмента
# атласа по сети. Быстрая череда правок не должна множить параллельные прогоны:
# считается последний. На push в main группа своя и ничего не отменяется.
concurrency:
  group: docs-guard-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      # В job исполняется внешний код (инструмент атласа) — токену на диске
      # делать нечего.
      # fetch-depth: 0 — шагу защищённых путей нужен базовый коммит PR для diff.
      - uses: actions/checkout@v4
        with: { persist-credentials: false, fetch-depth: 0 }

      - name: Лимит длины файлов состояния (300 строк)
        run: |
          fail=0
          for f in agent_docs/snapshot.md agent_docs/backlog.md; do
            [ -f "$f" ] || { echo "::error::отсутствует $f"; fail=1; continue; }
            n=$(wc -l < "$f")
            if [ "$n" -gt 300 ]; then
              echo "::error file=$f::$f содержит $n строк, лимит 300. Перенесите закрытое в backlog-closed.md"
              fail=1
            else
              echo "ok: $f — $n строк"
            fi
          done
          exit $fail

      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      # Описание PR есть только в событии pull_request; на push в main сверять
      # не с чем. Тело описания — недоверенный ввод: уходит через env, не через
      # ${{ }} внутри run.
      #
      # Список защищённых путей — из БАЗОВОГО коммита (объединяется с головным
      # в скрипте): иначе PR, вычеркнувший строку из списка, судился бы уже по
      # укороченному и снял бы защиту молча.
      #
      # --no-renames: по умолчанию git печатает только назначение переименования,
      # и вынос файла ИЗ защищённого каталога страж бы не потребовал назвать.
      # -z — потому что без него git берёт в кавычки путь с `"`, `\`, табом или
      # не-ASCII. Сбой git — своё сообщение и красный шаг, а не пустой список.
      - name: Защищённые пути названы в описании PR
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event.pull_request.base.sha }}
          ROLES_BASE_FILE: ${{ runner.temp }}/agent-roles-base.md
        run: |
          roles=agent_docs/guides/agent-roles.md
          git show "$BASE:$roles" > "$ROLES_BASE_FILE" || { echo "::error::git show ${BASE}:${roles} упал — базовый список защищённых путей не прочитан"; exit 1; }
          git diff -z --no-renames --name-only "$BASE" HEAD > "$RUNNER_TEMP/changed" || { echo "::error::git diff ${BASE}..HEAD упал — затронутые пути не определены"; exit 1; }
          node .github/scripts/protected-paths.mjs < "$RUNNER_TEMP/changed"

      # Порог «не в будущем» — время запуска шага, UTC (ADR 2026-09-11-1046).
      - name: Имена атомарных документов (формат, время, не в будущем)
        run: node .github/scripts/doc-names.mjs

      # Инструмент атласа — клон project-atlas на пине из atlas-tool.sh
      # (ADR 2026-09-12-0440). Путь уходит в окружение job: его читает и шаг
      # --check, и test/secrets-step.test.js для сверки образцов ключей.
      # Сначала присваивание, потом запись: внутри `echo "…$(…)"` сбой скрипта
      # дал бы пустую подстановку и код 0, шаг остался бы зелёным, а красное
      # пришло бы через два шага невнятным «cannot find module /build.js» —
      # и сверка образцов с инструментом молча пропустилась бы. Под `bash -e`
      # присваивание обрывает шаг там, где сломалось.
      - name: Инструмент атласа
        run: |
          tool=$(bash .github/scripts/atlas-tool.sh)
          echo "ATLAS_TOOL=$tool" >> "$GITHUB_ENV"

      # site/ не единица CI, а строки data.js добавляют PR класса C без ревью.
      - name: Данные страницы прогресса
        run: node --test test/*.test.js

      - name: Ссылки между документами разрешаются (атлас)
        run: node "$ATLAS_TOOL/build.js" --root . --config atlas/atlas.config.json --check

      # Образцы с хвостом ключа — те же, что KEY_SAMPLES инструмента
      # (`node build.js --samples`); совпадение проверяет test/secrets-step.test.js.
      # Буква префикса — в классе `[k]`, как в инструменте: выражение ловит те же
      # ключи, а сам текст гейта не префикс ключа.
      - name: Секреты не попали в репозиторий
        run: |
          # Только имена файлов (-l): строка с ключом не уходит в публичный журнал Actions.
          # Код grep: 0 — найдено, 1 — чисто, 2 и выше — проверка не выполнилась.
          # `|| rc=$?` сохраняет код и не даёт `bash -e` оборвать шаг.
          rc=0
          files=$(grep -rIl --exclude-dir=.git -E 's[k]-ant-[A-Za-z0-9_-]{10,}|BEGIN [A-Z0-9 ]*PRIVATE KEY|gs[k]_[A-Za-z0-9]{20,}|(^|[^A-Za-z0-9])gh[pousr]_[A-Za-z0-9]{20,}|(^|[^A-Za-z0-9])github_pat_[A-Za-z0-9_]{20,}' .) || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "::error::в репозитории найден похожий на реальный API-ключ, файлы: $(printf '%s' "$files" | tr '\n' ' ' | LC_ALL=C tr '[:cntrl:]' '?')"
            exit 1
          fi
          if [ "$rc" -ne 1 ]; then
            echo "::error::проверка секретов не выполнилась: grep вернул код $rc"
            exit 1
          fi
          echo "ok: ключей не найдено"

      # Разделы доказательств автора в описании PR класса A (ADR 2026-09-24-1230,
      # A1): «Что держит», «Красная ветвь», «Стенд ≠ прод». Форма — шаблон
      # .github/pull_request_template.md.
      #
      # ЧЕСТНАЯ ГРАНИЦА ШАГА: он проверяет ПРИСУТСТВИЕ разделов и их непустоту,
      # а не правду написанного. Правду проверяет гейт — reviewer и compliance
      # начинают с этих разделов и возвращают PR автору, если команда
      # невоспроизводима. Зелёный шаг НЕ значит «доказано»: это форсирующая
      # функция для автора, а не страж.
      #
      # Подсказки-комментарии шаблона за содержание не считаются — иначе
      # незаполненный шаблон проходил бы как заполненный.
      # Заголовок и тело описания — недоверенный ввод: уходят через env,
      # не через ${{ }} внутри run.
      - name: Разделы доказательств заполнены
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          case "$PR_TITLE" in
            *"[класс A]"*) ;;
            *) echo "заголовок не помечен [класс A] — разделы доказательств не требуются"; exit 0 ;;
          esac
          fail=0
          for h in "Что держит" "Красная ветвь" "Стенд ≠ прод"; do
            # Коды awk: 3 — раздела нет, 4 — раздел есть и пуст.
            # `|| rc=$?` сохраняет код и не даёт `bash -e` оборвать шаг.
            rc=0
            printf '%s\n' "$PR_BODY" | awk -v target="## $h" '
              { line=$0; sub(/\r$/, "", line); sub(/[ \t]+$/, "", line) }
              incomment { if (line ~ /-->/) incomment=0; next }
              # Заголовок внутри блока кода — цитата формы, а не раздел:
              # иначе процитированный «## Красная ветвь» давал зелёный шаг при
              # отсутствующем разделе (находка reviewer к PR #225).
              line ~ /^[ \t]*```/ { infence = !infence; if (inside) body=1; next }
              infence { if (inside) body=1; next }
              line ~ /^## / { inside = (line == target); if (inside) found=1; next }
              !inside { next }
              line ~ /^[ \t]*<!--/ && line !~ /-->/ { incomment=1; next }
              line ~ /^[ \t]*<!--.*-->$/ { next }
              line == "" { next }
              { body=1 }
              END { if (!found) exit 3; if (!body) exit 4 }
            ' || rc=$?
            case "$rc" in
              0) echo "ok: раздел «${h}» заполнен" ;;
              3) echo "::error::в описании PR класса A нет раздела «## ${h}» — форма в .github/pull_request_template.md"; fail=1 ;;
              4) echo "::error::раздел «## ${h}» в описании PR класса A пуст (подсказки шаблона за содержание не считаются)"; fail=1 ;;
              *) echo "::error::проверка раздела «${h}» не выполнилась: awk вернул код $rc"; fail=1 ;;
            esac
          done
          exit $fail
