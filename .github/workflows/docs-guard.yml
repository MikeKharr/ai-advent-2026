name: docs-guard

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Лимит длины файлов состояния (300 строк)
        run: |
          fail=0
          for f in agent_docs/snapshot.md agent_docs/backlog.md; do
            [ -f "$f" ] || { echo "::error::отсутствует $f"; fail=1; continue; }
            n=$(wc -l < "$f")
            if [ "$n" -gt 300 ]; then
              echo "::error file=$f::$f содержит $n строк, лимит 300. Перенесите закрытое в backlog-closed.md"
              fail=1
            else
              echo "ok: $f — $n строк"
            fi
          done
          exit $fail

      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      # Порог «не в будущем» — время запуска шага, UTC (ADR 2026-09-11-1046).
      - name: Имена атомарных документов (формат, время, не в будущем)
        run: node .github/scripts/doc-names.mjs

      - name: Тесты атласа
        run: node --test atlas/test/*.test.js

      # site/ не единица CI, а строки data.js добавляют PR класса C без ревью.
      - name: Данные страницы прогресса
        run: node --test test/*.test.js

      - name: Ссылки между документами разрешаются (атлас)
        run: node atlas/build.js --check

      # Образцы с хвостом ключа — те же, что KEY_SAMPLES в atlas/lib/texts.js
      # (совпадение проверяет atlas/test/secrets.test.js).
      - name: Секреты не попали в репозиторий
        run: |
          if grep -rIn --exclude-dir=.git -E 'sk-ant-[A-Za-z0-9_-]{10,}|BEGIN [A-Z ]*PRIVATE KEY|gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}' . ; then
            echo "::error::в репозитории найден похожий на реальный API-ключ"
            exit 1
          fi
          echo "ok: ключей не найдено"
