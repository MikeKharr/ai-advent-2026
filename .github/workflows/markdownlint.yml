name: markdownlint

on:
  # Без фильтра путей: lint — обязательная проверка main. Линтуется весь
  # репозиторий, поэтому PR без .md проходит так же, как с ними.
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v23
        with:
          globs: '**/*.md'
