name: deploy

on:
  push:
    branches: [main]
    paths: ['days/**', 'router/**', 'agents/**', 'mcp/**', 'mcpnews/**', 'mcpstore/**', 'site/**', 'deploy/**', 'atlas/**', 'agent_docs/**', '.claude/agents/**', '.agents/skills/*/SKILL.md', 'AGENTS.md', 'skills-lock.json', '.github/workflows/deploy.yml', '.github/scripts/atlas-tool.sh']
  workflow_dispatch:
    inputs:
      day:
        description: 'Одна единица для передеплоя: day1 …, router, agents, atlas, mcp, mcpnews или mcpstore. Пусто — все изменённые.'
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    # Токену detect не нужно ничего, кроме чтения кода и списка запусков.
    permissions:
      contents: read
      actions: read
    outputs:
      days: ${{ steps.set.outputs.days }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, persist-credentials: false }

      # База diff — последняя успешная выкатка по push, а не HEAD^: очередь
      # deploy-production отменяет ожидающий запуск, и его изменения должен
      # подобрать следующий. По updated_at, чтобы учесть повторные запуски.
      # pipefail: сбой API роняет detect, а не даёт пустую базу («все единицы»).
      - id: base
        if: ${{ !inputs.day }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/runs?branch=main&event=push&status=success&per_page=100" \
            --jq '.workflow_runs[] | [.updated_at, .head_sha] | @tsv' | sort | tail -1 | cut -f2)
          echo "sha=$base" >> "$GITHUB_OUTPUT"
          echo "последняя успешная выкатка: ${base:-нет}"

      - id: set
        env:
          DAY: ${{ inputs.day }}
          BASE: ${{ steps.base.outputs.sha }}
        run: |
          days=$(bash .github/scripts/deploy-units.sh "$DAY" "$BASE" HEAD)
          echo "days=$days" >> "$GITHUB_OUTPUT"
          echo "к сборке: $days"

  build:
    needs: detect
    if: needs.detect.outputs.days != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        day: ${{ fromJSON(needs.detect.outputs.days) }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      # Атлас: сначала витрина из репозитория, потом образ — в него идёт только
      # atlas/dist/site. Коммит в подвале страницы — HEAD этой сборки, github.sha.
      # Инструмент — клон project-atlas на пине из atlas-tool.sh; шаг стоит выше
      # входа в GHCR и setup-buildx: после логина на диске лежит
      # ~/.docker/config.json с токеном, и внешнему коду незачем исполняться
      # рядом. Границей остаётся job, а не порядок шагов (ADR 2026-09-12-0440,
      # раздел 3); защита от подмены версии — пин TOOL_SHA и класс A.
      - uses: actions/setup-node@v4
        if: matrix.day == 'atlas'
        with: { node-version: '22' }
      - name: Сборка витрины атласа
        if: matrix.day == 'atlas'
        run: |
          ATLAS_TOOL=$(bash .github/scripts/atlas-tool.sh)
          node "$ATLAS_TOOL/build.js" --root . --config atlas/atlas.config.json --out atlas/dist

      # Копия корпуса едет в образ rag, поэтому шаг стоит до docker build — по
      # образцу витрины атласа выше. Список корпуса живёт в rag/corpus.py, а не
      # здесь: тот же обход читает build.py, и разъехаться им негде. Репозиторий
      # в контейнер НЕ монтируется: рядом с ним на VPS лежат deploy/*.env
      # (ADR 2026-09-29-1639, п. 3).
      - name: Сборка корпуса для индекса
        if: matrix.day == 'rag'
        run: python3 rag/corpus.py --root . --out rag/corpus

      - uses: docker/setup-buildx-action@v3

      # Токен не лежит на диске, пока исполняется код репозитория: checkout
      # его не сохраняет (persist-credentials: false), вход в GHCR — после сборки.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Сборка и публикация
        uses: docker/build-push-action@v6
        with:
          context: ${{ contains(fromJSON('["router","agents","atlas","mcp","mcpnews","mcpstore","rag"]'), matrix.day) && matrix.day || format('days/{0}', matrix.day) }}
          push: true
          # Владелец в GHCR должен быть в нижнем регистре.
          tags: |
            ghcr.io/mikekharr/advent-${{ matrix.day }}:${{ github.sha }}
            ghcr.io/mikekharr/advent-${{ matrix.day }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [detect, build]
    # always() — деплой нужен и когда изменились только site/ или deploy/,
    # то есть когда build пропущен. Но не когда build упал.
    if: always() && !failure() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      # Репозиторий нужен этому job ради ОДНОГО файла — закреплённого ключа
      # хоста (ADR 2026-10-02-0921). Раньше checkout здесь не было вовсе:
      # `ssh-keyscan` файлов репозитория не требовал. Без этого шага выкатка
      # умирает на `install` с `No such file or directory` — то есть ровно той
      # невнятной ошибкой, которую пин и затевался убрать (находка reviewer).
      # sparse-checkout: тянем каталог deploy, а не всё дерево.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: deploy
          sparse-checkout-cone-mode: false

      # Секреты — через env шага, а не подстановкой в текст run: так их нет
      # в файле скрипта шага и в команде, которую видит shell.
      - name: Ключ доступа
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Ключ хоста ЗАКРЕПЛЁН в репозитории, а не выспрашивается у сервера.
          # Было `ssh-keyscan >> known_hosts` на каждом прогоне: оно принимало
          # любой предъявленный ключ, поэтому смену ключа 2026-10-02 выкатка не
          # заметила — её поймал только ноутбук владельца. Подмену она не
          # заметила бы ровно так же.
          # Имя хоста в файле не раскрыто: запись хеширована (`ssh-keygen -H`),
          # поиск по имени при этом работает. SSH_HOST остаётся секретом.
          install -m 600 "$GITHUB_WORKSPACE/deploy/known_hosts" ~/.ssh/known_hosts
          name="$SSH_HOST"
          [ "$SSH_PORT" = "22" ] || name="[$SSH_HOST]:$SSH_PORT"
          if ! ssh-keygen -F "$name" -f ~/.ssh/known_hosts >/dev/null; then
            echo "::error::в deploy/known_hosts нет записи для этого сервера — обновите пин по ADR 2026-10-02-0921-ssh-host-key-pin"
            exit 1
          fi

      - name: Выкатка
        env:
          DAYS: ${{ needs.detect.outputs.days }}
          SHA: ${{ github.sha }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          # Повторная проверка перед сервером: имена уходят в удалённую команду,
          # поэтому список — строго ["имя",…] с именами [a-z0-9]+.
          re='^\[("[a-z0-9]+"(,"[a-z0-9]+")*)?\]$'
          [[ $DAYS =~ $re ]] || { echo "::error::список единиц не прошёл белый список"; exit 1; }
          # Сверка ключа обязательна и названа явно: умолчание `ask` в неинтер-
          # активном прогоне тоже отказало бы, но тогда защита держалась бы на
          # отсутствии терминала, а не на решении.
          ssh -p "$SSH_PORT" \
              -o StrictHostKeyChecking=yes \
              "$SSH_USER@$SSH_HOST" \
              "DAYS='$DAYS' SHA='$SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          cd ~/ai-advent-2026

          echo "==> git pull (Caddyfile, compose.yml, лендинг)"
          git fetch --depth 50 origin main
          git reset --hard origin/main

          cd deploy
          touch .env && chmod 600 .env

          # Пин тега образа для каждого пересобранного дня.
          for day in $(printf '%s' "$DAYS" | tr -d '[]"' | tr ',' ' '); do
            [ -z "$day" ] && continue
            var="$(printf '%s' "$day" | tr '[:lower:]' '[:upper:]')_TAG"
            echo "==> $var=$SHA"
            if grep -q "^${var}=" .env; then
              sed -i "s|^${var}=.*|${var}=${SHA}|" .env
            else
              echo "${var}=${SHA}" >> .env
            fi
            docker compose pull "$day"
          done

          echo "==> перезапуск"
          docker compose up -d --remove-orphans

          # Контейнер времени пересоздаётся всегда. Его таблица crond
          # собирается на старте из agents/config/jobs.json, а `up -d` его не
          # трогает: строка службы в compose.yml от смены каденции не
          # меняется, образ у него стоковый и по digest, значит новая частота
          # молча осталась бы на старой. Признака «файл менялся» здесь не
          # заводим: контейнер не держит ни состояния, ни догона пропущенного
          # (deploy/cron/tick.sh), поэтому пересоздать его дешевле, чем
          # завести вторую отметку применённого и вторую дыру в ней.
          echo "==> пересоздание контейнера времени (каденция из jobs.json)"
          docker compose up -d --force-recreate cron
          docker image prune -f --filter "until=168h" || true

          # Вход приводится в соответствие с конфигурацией: Caddy читает
          # Caddyfile только при старте, а файл примонтирован файлом, поэтому
          # `up -d` контейнер не пересоздаёт и новый маршрут не доезжает.
          #
          # Признак — не «файл менялся в этом pull», а расхождение файла с
          # отметкой о последней **удачно применённой** сумме. Сравнение
          # до/после `git reset` имело бы дыру: прогон, упавший уже после
          # reset, человек перезапускает — суммы равны, перезагрузка
          # пропускается, вход молча остаётся на прежней конфигурации, а
          # выкатка зелёная. Живая проверка это поймала бы только у правки,
          # добавляющей маршрут дня; смена заголовка или цели прокси прошла бы
          # незамеченной. Отметка лежит вне репозитория: `git reset --hard`
          # её не трогает, а её отсутствие (свежая машина, первый прогон)
          # уводит в перезагрузку — ошибаться безопаснее в эту сторону.
          #
          # Перезагрузка, а не перезапуск: `caddy reload` подменяет
          # конфигурацию на живом процессе, не разрывая слушателей, тогда как
          # restart роняет все адреса на секунды, а при негодной конфигурации
          # оставляет вход лежать.
          #
          # Проверка до применения: `validate` разбирает файл в том же
          # контейнере, что будет его исполнять. Гейт `caddyfile` в CI смотрит
          # тот же файл, но на другой машине и до мержа — он не доказывает,
          # что на сервер доехало именно это содержимое.
          #
          # Повторы у `reload`: шаг идёт после `up -d`, который возвращается по
          # старту, а не по готовности. Контейнер входа, только что
          # пересозданный из-за новой зависимости, поднимает административный
          # интерфейс не мгновенно, и первая попытка может прийтись на эти
          # секунды. Журнал `caddy` сюда не печатается намеренно: репозиторий
          # публичный, а у входа включён журнал обращений с адресами клиентов;
          # причину отказа печатает сам `reload`.
          applied_file="$HOME/.advent-caddy-applied"
          caddyfile_now=$(sha256sum Caddyfile | cut -d' ' -f1)
          caddyfile_applied=$(cat "$applied_file" 2>/dev/null || true)
          if [ "$caddyfile_now" != "$caddyfile_applied" ]; then
            echo "==> конфигурация входа разошлась с применённой, проверка на сервере"
            if ! docker compose exec -T caddy caddy validate --adapter caddyfile --config /etc/caddy/Caddyfile; then
              echo "::error::проверка Caddyfile на сервере не прошла (негодная конфигурация или не поднят контейнер caddy); вход оставлен на прежней конфигурации"
              exit 1
            fi
            reloaded=0
            for i in $(seq 1 5); do
              if docker compose exec -T caddy caddy reload --adapter caddyfile --config /etc/caddy/Caddyfile; then
                reloaded=1
                break
              fi
              echo "перезагрузка не удалась (попытка $i/5), повтор через 3 с"
              sleep 3
            done
            [ "$reloaded" = 1 ] || { echo "::error::перезагрузка конфигурации Caddy не удалась за 5 попыток"; exit 1; }
            printf '%s\n' "$caddyfile_now" > "$applied_file"
            echo "==> конфигурация входа перезагружена"
          else
            echo "==> конфигурация входа совпадает с применённой, вход не трогаем"
          fi

          # У роутера, сервиса агентов и серверов MCP дней 19–20 нет публичного
          # адреса — их здоровье проверяется здесь, по healthcheck контейнера.
          # Единица rag публичный адрес имеет (/rag/healthz), и она здесь по той
          # же причине, что mcp. Отдельно про неё: 200 на /healthz значит «единица
          # поднялась», а не «индекс готов» — состояние сборки лежит в теле
          # ответа, и первая полная сборка на VPS идёт часами уже после зелёной
          # выкатки. Служба ollama сюда не попадает по устройству: у неё нет
          # Dockerfile, она не единица выкатки и в $DAYS не появляется — её
          # поднимает общий `docker compose up -d` выше.
          # Служба MCP публичный адрес имеет, но здесь она тоже: так отказ самой
          # службы отличается от неприменённого маршрута входа — иначе оба
          # выглядели бы как красная «Проверка живого сайта».
          #
          # Совпадение — по имени в кавычках, а не по подстроке: `grep -q mcp`
          # находил бы себя в "mcpnews" и "mcpstore", и выкатка одного только
          # mcpnews молча ждала бы здоровья чужого контейнера mcp, который в
          # этой выкатке не менялся. Зелёный результат при этом ничего не
          # значил бы.
          for svc in router agents mcp mcpnews mcpstore rag; do
            printf '%s' "$DAYS" | grep -q "\"$svc\"" || continue
            echo "==> ожидание $svc: healthy"
            for i in $(seq 1 20); do
              state=$(docker inspect --format '{{.State.Health.Status}}' "advent-$svc-1" 2>/dev/null || echo none)
              [ "$state" = healthy ] && break
              sleep 3
            done
            [ "$state" = healthy ] || { docker compose logs --tail 50 "$svc"; echo "$svc не стал healthy: $state"; exit 1; }
          done

          echo "==> состояние"
          docker compose ps
          REMOTE

      - name: Проверка живого сайта
        env:
          DAYS: ${{ needs.detect.outputs.days }}
        run: |
          ok=1
          for i in $(seq 1 15); do
            code=$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' https://challenge.zpq.ai/ || echo 000)
            if [ "$code" = "200" ]; then ok=0; break; fi
            echo "лендинг: $code, повтор через 4 с"; sleep 4
          done
          [ "$ok" -eq 0 ] || { echo "::error::лендинг не отвечает 200"; exit 1; }
          echo "лендинг ok"

          # Исключены только единицы без публичного адреса: роутер, сервис
          # агентов и серверы MCP дней 19–20 (ADR 2026-09-28-0736, п. 3 —
          # маршрута в Caddyfile у них нет и не будет, их /healthz проверен выше
          # по healthcheck контейнера). Для mcp адрес есть — /mcp/healthz открыт
          # без ключа именно ради этой проверки (ADR 2026-09-23-1227, п. 1), и
          # общая строка ниже его и дёргает.
          #
          # Контейнер времени cron сюда не попадает по устройству, а не по
          # списку: у него нет Dockerfile, поэтому он не единица выкатки и в
          # $DAYS не появляется вовсе (ADR 2026-09-28-0736, п. 6).
          #
          # case, а не цепочка `[ … ] || [ … ] && continue`: цепочка из четырёх
          # имён читается неоднозначно, и добавить в неё пятое имя мимо `&&` —
          # ровно та правка, после которой шаг зеленеет молча.
          for day in $(printf '%s' "$DAYS" | tr -d '[]"' | tr ',' ' '); do
            case "$day" in
              ''|router|agents|mcpnews|mcpstore) continue ;;
            esac
            ok=1
            for i in $(seq 1 12); do
              code=$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' "https://challenge.zpq.ai/${day}/healthz" || echo 000)
              echo "${day}/healthz: ${code} (попытка ${i}/12)"
              if [ "$code" = "200" ]; then ok=0; break; fi
              if [ "$i" -lt 12 ]; then sleep 4; fi
            done
            [ "$ok" -eq 0 ] || { echo "::error::${day} не отвечает 200 на /healthz за 12 попыток"; exit 1; }
          done
