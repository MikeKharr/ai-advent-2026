name: deploy

on:
  push:
    branches: [main]
    paths: ['days/**', 'router/**', 'agents/**', 'site/**', 'deploy/**', 'atlas/**', 'agent_docs/**', '.claude/agents/**', '.agents/skills/*/SKILL.md', 'AGENTS.md', 'skills-lock.json', '.github/workflows/deploy.yml', '.github/scripts/atlas-tool.sh']
  workflow_dispatch:
    inputs:
      day:
        description: 'Одна единица для передеплоя: day1 …, router, agents или atlas. Пусто — все изменённые.'
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    # Токену detect не нужно ничего, кроме чтения кода и списка запусков.
    permissions:
      contents: read
      actions: read
    outputs:
      days: ${{ steps.set.outputs.days }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, persist-credentials: false }

      # База diff — последняя успешная выкатка по push, а не HEAD^: очередь
      # deploy-production отменяет ожидающий запуск, и его изменения должен
      # подобрать следующий. По updated_at, чтобы учесть повторные запуски.
      # pipefail: сбой API роняет detect, а не даёт пустую базу («все единицы»).
      - id: base
        if: ${{ !inputs.day }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/runs?branch=main&event=push&status=success&per_page=100" \
            --jq '.workflow_runs[] | [.updated_at, .head_sha] | @tsv' | sort | tail -1 | cut -f2)
          echo "sha=$base" >> "$GITHUB_OUTPUT"
          echo "последняя успешная выкатка: ${base:-нет}"

      - id: set
        env:
          DAY: ${{ inputs.day }}
          BASE: ${{ steps.base.outputs.sha }}
        run: |
          days=$(bash .github/scripts/deploy-units.sh "$DAY" "$BASE" HEAD)
          echo "days=$days" >> "$GITHUB_OUTPUT"
          echo "к сборке: $days"

  build:
    needs: detect
    if: needs.detect.outputs.days != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        day: ${{ fromJSON(needs.detect.outputs.days) }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      # Атлас: сначала витрина из репозитория, потом образ — в него идёт только
      # atlas/dist/site. Коммит в подвале страницы — HEAD этой сборки, github.sha.
      # Инструмент — клон project-atlas на пине из atlas-tool.sh; шаг стоит выше
      # входа в GHCR и setup-buildx: после логина на диске лежит
      # ~/.docker/config.json с токеном, и внешнему коду незачем исполняться
      # рядом. Границей остаётся job, а не порядок шагов (ADR 2026-09-12-0440,
      # раздел 3); защита от подмены версии — пин TOOL_SHA и класс A.
      - uses: actions/setup-node@v4
        if: matrix.day == 'atlas'
        with: { node-version: '22' }
      - name: Сборка витрины атласа
        if: matrix.day == 'atlas'
        run: |
          ATLAS_TOOL=$(bash .github/scripts/atlas-tool.sh)
          node "$ATLAS_TOOL/build.js" --root . --config atlas/atlas.config.json --out atlas/dist

      - uses: docker/setup-buildx-action@v3

      # Токен не лежит на диске, пока исполняется код репозитория: checkout
      # его не сохраняет (persist-credentials: false), вход в GHCR — после сборки.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Сборка и публикация
        uses: docker/build-push-action@v6
        with:
          context: ${{ contains(fromJSON('["router","agents","atlas"]'), matrix.day) && matrix.day || format('days/{0}', matrix.day) }}
          push: true
          # Владелец в GHCR должен быть в нижнем регистре.
          tags: |
            ghcr.io/mikekharr/advent-${{ matrix.day }}:${{ github.sha }}
            ghcr.io/mikekharr/advent-${{ matrix.day }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [detect, build]
    # always() — деплой нужен и когда изменились только site/ или deploy/,
    # то есть когда build пропущен. Но не когда build упал.
    if: always() && !failure() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      # Секреты — через env шага, а не подстановкой в текст run: так их нет
      # в файле скрипта шага и в команде, которую видит shell.
      - name: Ключ доступа
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Выкатка
        env:
          DAYS: ${{ needs.detect.outputs.days }}
          SHA: ${{ github.sha }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          # Повторная проверка перед сервером: имена уходят в удалённую команду,
          # поэтому список — строго ["имя",…] с именами [a-z0-9]+.
          re='^\[("[a-z0-9]+"(,"[a-z0-9]+")*)?\]$'
          [[ $DAYS =~ $re ]] || { echo "::error::список единиц не прошёл белый список"; exit 1; }
          ssh -p "$SSH_PORT" \
              "$SSH_USER@$SSH_HOST" \
              "DAYS='$DAYS' SHA='$SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          cd ~/ai-advent-2026

          echo "==> git pull (Caddyfile, compose.yml, лендинг)"
          git fetch --depth 50 origin main
          git reset --hard origin/main

          cd deploy
          touch .env && chmod 600 .env

          # Пин тега образа для каждого пересобранного дня.
          for day in $(printf '%s' "$DAYS" | tr -d '[]"' | tr ',' ' '); do
            [ -z "$day" ] && continue
            var="$(printf '%s' "$day" | tr '[:lower:]' '[:upper:]')_TAG"
            echo "==> $var=$SHA"
            if grep -q "^${var}=" .env; then
              sed -i "s|^${var}=.*|${var}=${SHA}|" .env
            else
              echo "${var}=${SHA}" >> .env
            fi
            docker compose pull "$day"
          done

          echo "==> перезапуск"
          docker compose up -d --remove-orphans
          docker image prune -f --filter "until=168h" || true

          # У роутера и сервиса агентов нет публичного адреса — их здоровье
          # проверяется здесь, по healthcheck контейнера.
          for svc in router agents; do
            printf '%s' "$DAYS" | grep -q "$svc" || continue
            echo "==> ожидание $svc: healthy"
            for i in $(seq 1 20); do
              state=$(docker inspect --format '{{.State.Health.Status}}' "advent-$svc-1" 2>/dev/null || echo none)
              [ "$state" = healthy ] && break
              sleep 3
            done
            [ "$state" = healthy ] || { docker compose logs --tail 50 "$svc"; echo "$svc не стал healthy: $state"; exit 1; }
          done

          echo "==> состояние"
          docker compose ps
          REMOTE

      - name: Проверка живого сайта
        env:
          DAYS: ${{ needs.detect.outputs.days }}
        run: |
          ok=1
          for i in $(seq 1 15); do
            code=$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' https://challenge.zpq.ai/ || echo 000)
            if [ "$code" = "200" ]; then ok=0; break; fi
            echo "лендинг: $code, повтор через 4 с"; sleep 4
          done
          [ "$ok" -eq 0 ] || { echo "::error::лендинг не отвечает 200"; exit 1; }
          echo "лендинг ok"

          for day in $(printf '%s' "$DAYS" | tr -d '[]"' | tr ',' ' '); do
            [ -z "$day" ] || [ "$day" = router ] || [ "$day" = agents ] && continue
            ok=1
            for i in $(seq 1 12); do
              code=$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' "https://challenge.zpq.ai/${day}/healthz" || echo 000)
              echo "${day}/healthz: ${code} (попытка ${i}/12)"
              if [ "$code" = "200" ]; then ok=0; break; fi
              if [ "$i" -lt 12 ]; then sleep 4; fi
            done
            [ "$ok" -eq 0 ] || { echo "::error::${day} не отвечает 200 на /healthz за 12 попыток"; exit 1; }
          done
