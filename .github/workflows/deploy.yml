name: deploy

on:
  push:
    branches: [main]
    paths: ['days/**', 'router/**', 'agents/**', 'site/**', 'deploy/**', 'atlas/**', 'agent_docs/**', '.claude/agents/**', '.agents/skills/*/SKILL.md', 'AGENTS.md', 'skills-lock.json', '.github/workflows/deploy.yml']
  workflow_dispatch:
    inputs:
      day:
        description: 'Одна единица для передеплоя: day1 …, router, agents или atlas. Пусто — все изменённые.'
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      days: ${{ steps.set.outputs.days }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: set
        run: |
          if [ -n "${{ inputs.day }}" ]; then
            days=$(printf '%s' '${{ inputs.day }}' | jq -R . | jq -sc .)
          else
            base="$(git rev-parse HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)"
            changed=$(git diff --name-only "$base" HEAD)
            # Входы графа атласа — atlas/lib/sources.js; то же правило, что в ci.yml.
            atlas='^(atlas/|agent_docs/|\.claude/agents/|\.agents/skills/[^/]+/SKILL\.md$|AGENTS\.md$|skills-lock\.json$|deploy/(compose\.yml|Caddyfile)$|site/index\.html$|router/config/providers\.json$)'
            days=$(printf '%s\n' "$changed" | { grep -oE '^days/[^/]+' | cut -d/ -f2; printf '%s\n' "$changed" | grep -oE '^(router|agents)/' | cut -d/ -f1; printf '%s\n' "$changed" | grep -qE "$atlas" && echo atlas; } | sort -u | jq -R . | jq -sc .)
            [ -z "$days" ] && days='[]'
          fi
          echo "days=$days" >> "$GITHUB_OUTPUT"
          echo "к сборке: $days"

  build:
    needs: detect
    if: needs.detect.outputs.days != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        day: ${{ fromJSON(needs.detect.outputs.days) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Атлас: сначала витрина из репозитория, потом образ — в него идёт только
      # atlas/dist/site. Коммит в подвале страницы — HEAD этой сборки, github.sha.
      - uses: actions/setup-node@v4
        if: matrix.day == 'atlas'
        with: { node-version: '22' }
      - name: Сборка витрины атласа
        if: matrix.day == 'atlas'
        run: node atlas/build.js

      # Вход в GHCR — после кода репозитория: токен с packages: write не
      # лежит на диске раннера, пока исполняется node atlas/build.js.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Сборка и публикация
        uses: docker/build-push-action@v6
        with:
          context: ${{ contains(fromJSON('["router","agents","atlas"]'), matrix.day) && matrix.day || format('days/{0}', matrix.day) }}
          push: true
          # Владелец в GHCR должен быть в нижнем регистре.
          tags: |
            ghcr.io/mikekharr/advent-${{ matrix.day }}:${{ github.sha }}
            ghcr.io/mikekharr/advent-${{ matrix.day }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [detect, build]
    # always() — деплой нужен и когда изменились только site/ или deploy/,
    # то есть когда build пропущен. Но не когда build упал.
    if: always() && !failure() && !cancelled()
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Ключ доступа
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.SSH_PORT || 22 }}" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Выкатка
        env:
          DAYS: ${{ needs.detect.outputs.days }}
          SHA: ${{ github.sha }}
        run: |
          ssh -p "${{ secrets.SSH_PORT || 22 }}" \
              "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
              "DAYS='$DAYS' SHA='$SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          cd ~/ai-advent-2026

          echo "==> git pull (Caddyfile, compose.yml, лендинг)"
          git fetch --depth 50 origin main
          git reset --hard origin/main

          cd deploy
          touch .env && chmod 600 .env

          # Пин тега образа для каждого пересобранного дня.
          for day in $(printf '%s' "$DAYS" | tr -d '[]"' | tr ',' ' '); do
            [ -z "$day" ] && continue
            var="$(printf '%s' "$day" | tr '[:lower:]' '[:upper:]')_TAG"
            echo "==> $var=$SHA"
            if grep -q "^${var}=" .env; then
              sed -i "s|^${var}=.*|${var}=${SHA}|" .env
            else
              echo "${var}=${SHA}" >> .env
            fi
            docker compose pull "$day"
          done

          echo "==> перезапуск"
          docker compose up -d --remove-orphans
          docker image prune -f --filter "until=168h" || true

          # У роутера и сервиса агентов нет публичного адреса — их здоровье
          # проверяется здесь, по healthcheck контейнера.
          for svc in router agents; do
            printf '%s' "$DAYS" | grep -q "$svc" || continue
            echo "==> ожидание $svc: healthy"
            for i in $(seq 1 20); do
              state=$(docker inspect --format '{{.State.Health.Status}}' "advent-$svc-1" 2>/dev/null || echo none)
              [ "$state" = healthy ] && break
              sleep 3
            done
            [ "$state" = healthy ] || { docker compose logs --tail 50 "$svc"; echo "$svc не стал healthy: $state"; exit 1; }
          done

          echo "==> состояние"
          docker compose ps
          REMOTE

      - name: Проверка живого сайта
        run: |
          ok=1
          for i in $(seq 1 15); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' https://challenge.zpq.ai/ || echo 000)
            if [ "$code" = "200" ]; then ok=0; break; fi
            echo "лендинг: $code, повтор через 4 с"; sleep 4
          done
          [ "$ok" -eq 0 ] || { echo "::error::лендинг не отвечает 200"; exit 1; }
          echo "лендинг ok"

          for day in $(printf '%s' '${{ needs.detect.outputs.days }}' | tr -d '[]"' | tr ',' ' '); do
            [ -z "$day" ] || [ "$day" = router ] || [ "$day" = agents ] && continue
            code=$(curl -sS -o /dev/null -w '%{http_code}' "https://challenge.zpq.ai/${day}/healthz" || echo 000)
            echo "${day}/healthz: ${code}"
            [ "$code" = "200" ] || { echo "::error::${day} не отвечает на /healthz"; exit 1; }
          done
