name: ci

on:
  pull_request:
    paths: ['days/**', 'site/**', 'deploy/**', '.github/workflows/ci.yml']
  push:
    branches: [main]
    paths: ['days/**', 'site/**', 'deploy/**', '.github/workflows/ci.yml']

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      days: ${{ steps.set.outputs.days }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: set
        name: Какие дни затронуты
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="$(git rev-parse HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)"
          fi
          changed=$(git diff --name-only "$base" HEAD || true)
          days=$(printf '%s\n' "$changed" | grep -oE '^days/[^/]+' | cut -d/ -f2 | sort -u | jq -R . | jq -sc .)
          [ -z "$days" ] && days='[]'
          echo "days=$days" >> "$GITHUB_OUTPUT"
          echo "затронуты: $days"

  test:
    needs: detect
    if: needs.detect.outputs.days != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        day: ${{ fromJSON(needs.detect.outputs.days) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: Синтаксис
        working-directory: days/${{ matrix.day }}
        run: for f in $(find . -name '*.js' -not -path './node_modules/*'); do node --check "$f"; done

      - name: Тесты
        working-directory: days/${{ matrix.day }}
        run: |
          if ls test/*.test.js >/dev/null 2>&1 || ls *.test.js >/dev/null 2>&1; then
            node --test
          else
            echo "тестов нет — пропуск"
          fi

      - name: Сборка образа (без публикации)
        run: docker build -t ci-check:${{ matrix.day }} days/${{ matrix.day }}

      - name: Контейнер поднимается и отвечает на /healthz
        run: |
          docker run -d --name c -p 8080:8080 ci-check:${{ matrix.day }}
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1; then
              echo "healthz ok"; docker rm -f c; exit 0
            fi
            sleep 1
          done
          echo "::error::контейнер не ответил на /healthz за 20 с"
          docker logs c; docker rm -f c; exit 1

  caddyfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Проверка Caddyfile
        run: docker run --rm -v "$PWD/deploy:/w" -w /w caddy:2-alpine caddy validate --config Caddyfile
