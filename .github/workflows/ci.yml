name: ci

on:
  # Без фильтра путей: ci-ok — обязательная проверка main и должна появиться
  # на каждом PR. Нетронутые единицы отсекает detect (days=[] — test пропущен).
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      days: ${{ steps.set.outputs.days }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # Имя единицы уходит в команду на прод-сервере, и выкатка по push
      # останавливается на имени вне [a-z0-9]+ (.github/scripts/deploy-units.sh,
      # то же правило) — поэтому такое имя не должно попасть в main.
      - name: Имена единиц выкатки
        run: |
          # -z: путь git не берёт в кавычки; `\n` в имени — `?`, имя падает ниже.
          # pipefail — только в подстановке: сбой git не даёт «ok», а grep -v
          # без совпадений ниже не валит шаг.
          tree=$(set -o pipefail; git ls-tree -r -z --name-only HEAD | tr '\n\0' '?\n') || { echo "::error::git ls-tree упал — имена единиц не проверены"; exit 1; }
          # Управляющие символы имени не уходят в команду workflow.
          bad=$(printf '%s\n' "$tree" | grep -E '^(days/[^/]+|router|agents|atlas|mcpnews|mcpstore|mcp|rag)/Dockerfile$' | sed -E 's#^(days/)?([^/]+)/Dockerfile$#\2#' | grep -vE '^[a-z0-9]+$' | tr '\n' ' ' | LC_ALL=C tr '[:cntrl:]' '?')
          if [ -n "$bad" ]; then
            echo "::error::имя единицы выкатки вне [a-z0-9]+ (каталог с Dockerfile): ${bad}— переименуйте каталог"
            exit 1
          fi
          echo "имена единиц ok"
      # Граница исключения из «Node 22 без runtime-зависимостей»
      # (ADR 2026-09-07-1525): зависимости разрешены только тем единицам и
      # только на те пакеты, которые названы в карте ниже.
      # Проза границ не держит, поэтому держит этот шаг. Он читает КАЖДЫЙ
      # манифест дерева, а не список известных единиц: новая единица со
      # своими зависимостями появилась бы молча.
      # Карта «единица → точные имена пакетов». Умолчание для любой единицы
      # вне карты — ноль: новая единица получает право на пакет только строкой
      # в этой карте, а карта живёт в .github/** — защищённый путь, класс A,
      # вето compliance (ADR 2026-09-29-1639, п. 1; заведена ADR 2026-09-07-1525).
      - name: Граница runtime-зависимостей
        run: |
          # Ключ карты — «единица + реестр», а не одна единица: имя пакета
          # ничего не значит без реестра, и один список на два реестра дал бы
          # единице rag право тянуть ИЗ NPM пакеты `numpy` и `packaging` —
          # существующие там пакеты неродственных авторов, то есть готовую
          # мишень подмены зависимости (находка reviewer к PR #276).
          allowed_for() {
            case "$1/$2" in
              mcp/npm) echo '@modelcontextprotocol/sdk zod' ;;
              rag/pip) echo 'faiss-cpu numpy packaging' ;;
              *) echo '' ;;
            esac
          }
          fail=0
          # node_modules исключён: это установленные пакеты, а не наши манифесты.
          files=$(find . -name package.json -not -path '*/node_modules/*' -not -path './.git/*' | sort)
          reqs=$(find . -name requirements.txt -not -path '*/node_modules/*' -not -path './.git/*' | sort)
          if [ -z "$files" ] && [ -z "$reqs" ]; then
            echo "::error::в дереве нет ни одного package.json и ни одного requirements.txt — страж не проверил ничего"
            exit 1
          fi
          # Манифесты, объявляющие зависимости мимо двух читаемых форм. Список
          # ИМЕННОЙ, а не исчерпывающий: страж краснеет на перечисленных ниже
          # именах, а не на «любой третьей форме» — обещать большее этот код не
          # может, и обещание в комментарии тоже держателем не является
          # (находки compliance и reviewer к PR #276). Имя, которого здесь нет,
          # пройдёт молча; появилась форма — строка сюда, PR класса A.
          # `setup.py` вдобавок ИСПОЛНЯЕТСЯ — ровно то, ради чего в проекте
          # стоят `--ignore-scripts` и `--only-binary`. `requirements-*.txt` и
          # `constraints.txt` pip читает, а шаг ниже — нет: они тоже красные.
          others=$(find . \( -name pyproject.toml -o -name Pipfile -o -name Pipfile.lock -o -name poetry.lock -o -name uv.lock -o -name pdm.lock -o -name setup.py -o -name setup.cfg -o -name environment.yml -o -name environment.yaml -o -name conda-lock.yml -o -name 'requirements-*.txt' -o -name 'requirements_*.txt' -o -name constraints.txt \) -not -path '*/node_modules/*' -not -path './.git/*' | sort)
          if [ -n "$others" ]; then
            while IFS= read -r f; do
              echo "::error file=${f#./}::манифест объявляет зависимости мимо стража — читаются только package.json и requirements.txt (ADR 2026-09-29-1639, п. 1)"
            done <<< "$others"
            fail=1
          fi
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            rel=${f#./}
            # Единица — каталог самого манифеста, а не первый сегмент пути:
            # иначе mcp/vendor/package.json получил бы права единицы mcp.
            unit=$(dirname "$rel")
            allowed=$(allowed_for "$unit" npm)
            # Три раздела, а не один: `optionalDependencies` ставится тем же
            # `npm ci` и доезжает до образа (`--omit=dev` его не снимает),
            # `peerDependencies` объявляет ту же чужую единицу зависимостью.
            # Читать только `.dependencies` значило бы отдать границу за одно
            # переименование раздела (находка reviewer к PR дня 16).
            # `devDependencies` намеренно не в счёт: в образ они не едут.
            runtime='[(.dependencies // {}), (.optionalDependencies // {}), (.peerDependencies // {})] | add'
            names=$(jq -r "$runtime | keys[]" "$f") || { echo "::error file=${rel}::package.json не разобран"; fail=1; continue; }
            for name in $names; do
              case " $allowed " in
                *" $name "*) ;;
                *) echo "::error file=${rel}::runtime-зависимость ${name} вне карты единицы ${unit} для реестра npm (разрешено: ${allowed:-ничего}) — ADR 2026-09-29-1639, п. 1"; fail=1; continue ;;
              esac
              # Версия точная, без ^ и ~: поднятие версии SDK — отдельный PR
              # класса A с гейтом compliance, а не тихий разброс диапазона.
              version=$(jq -r --arg n "$name" "$runtime | .[\$n]" "$f")
              # Шаблон якорится с обоих концов: без хвостового якоря запись
              # вида `1.30.0 || 2.0.0` — диапазон из двух версий — проходила
              # бы как точная (находка reviewer к PR дня 16).
              if [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
                echo "ok: ${rel} — ${name}@${version}"
              else
                echo "::error file=${rel}::версия ${name} не точная: ${version} (ADR 2026-09-23-1227, п. 2)"
                fail=1
              fi
            done
          done <<< "$files"
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            rel=${f#./}
            unit=$(dirname "$rel")
            allowed=$(allowed_for "$unit" pip)
            # Продолжения строк склеиваются: pip пишет хэши на следующих
            # строках через `\`, и разбор построчно принял бы «пакет==версия»
            # как строку без хэша, а хвост с хэшами — как мусор.
            joined=$(awk '
              { line = buf $0; buf = "" }
              line ~ /\\[ \t]*$/ { sub(/\\[ \t]*$/, "", line); buf = line; next }
              { print line }
              END { if (buf != "") print buf }
            ' "$f")
            while IFS= read -r line; do
              # Комментарий отрезается по правилу pip — `#` в начале строки
              # или после пробела, а не по любому `#`: страж должен читать
              # строку так же, как читатель, которого он стережёт (находка
              # reviewer к PR #276). `#` внутри токена остаётся и краснеет
              # ниже как лишний хвост.
              line=$(printf '%s' "$line" | sed -E -e 's/(^|[[:space:]])#.*$//' -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
              [ -n "$line" ] || continue
              case "$line" in
                --require-hashes|--no-deps) continue ;;
                # Ветвь ниже — шаблон, и `*` съедает ОСТАТОК СТРОКИ, а не хвост
                # значения: `--only-binary=:all: --index-url https://…` прошла
                # бы зелёной мимо ветви `-*)`, и pip такую строку разбирает
                # через shlex — обе опции применяются (находка compliance к
                # PR #276). Поэтому вторая директива в той же строке — красная.
                --only-binary=*[[:space:]]*) echo "::error file=${rel}::после --only-binary= в строке «${line}» ещё одна директива — по директиве на строку (ADR 2026-09-29-1639, п. 1)"; fail=1; continue ;;
                --only-binary=*) continue ;;
                # -r, --index-url, -e и прочее тянут зависимости и код из мест,
                # которых в этом файле не видно: в карту они не вписываются.
                # Хэши здесь не спасают: удалённый `-r <url>` приносит свои
                # пакеты со своими хэшами, сходящимися сами с собой.
                -*) echo "::error file=${rel}::директива «${line}» не читается стражем — в requirements.txt только «пакет==версия --hash=sha256:…» (ADR 2026-09-29-1639, п. 1)"; fail=1; continue ;;
              esac
              if [[ ! $line =~ ^([A-Za-z0-9][A-Za-z0-9._-]*)==([^[:space:]]+)(.*)$ ]]; then
                echo "::error file=${rel}::строка «${line}» не вида «пакет==версия»: версия не закреплена (ADR 2026-09-29-1639, п. 1)"
                fail=1
                continue
              fi
              name=${BASH_REMATCH[1]}
              version=${BASH_REMATCH[2]}
              rest=${BASH_REMATCH[3]}
              case " $allowed " in
                *" $name "*) ;;
                *) echo "::error file=${rel}::runtime-зависимость ${name} вне карты единицы ${unit} для реестра pip (разрешено: ${allowed:-ничего}) — ADR 2026-09-29-1639, п. 1"; fail=1; continue ;;
              esac
              if [[ ! $version =~ ^[0-9]+(\.[0-9]+)+$ ]]; then
                echo "::error file=${rel}::версия ${name} не точная: ${version} (ADR 2026-09-29-1639, п. 1)"
                fail=1
                continue
              fi
              # Хэш обязателен у каждой строки: `pip --require-hashes` без него
              # откажется ставить, но флаг живёт в Dockerfile, а не здесь, и
              # снять его — одна строка. Прибивать байты должен тот же файл.
              hashes=0
              bad=0
              # В массив через `read -ra`, а не `for token in $rest`: там
              # токены проходили бы ещё и глоббинг (находка compliance).
              read -ra tokens <<< "$rest"
              for token in "${tokens[@]}"; do
                if [[ $token =~ ^--hash=sha256:[0-9a-f]{64}$ ]]; then
                  hashes=$((hashes + 1))
                else
                  echo "::error file=${rel}::у ${name} лишний хвост «${token}» — допустимы только --hash=sha256:… (ADR 2026-09-29-1639, п. 1)"
                  bad=1
                fi
              done
              if [ "$bad" -eq 1 ]; then fail=1; continue; fi
              if [ "$hashes" -eq 0 ]; then
                echo "::error file=${rel}::у ${name}==${version} нет --hash=sha256:… — байты пакета ничем не прибиты (ADR 2026-09-29-1639, п. 1)"
                fail=1
                continue
              fi
              echo "ok: ${rel} — ${name}==${version}, хэшей: ${hashes}"
            done <<< "$joined"
          done <<< "$reqs"
          [ "$fail" -eq 0 ] || exit 1
          echo "граница зависимостей ok"
      # Хэши в манифестах прибивают байты, пока закрыт список. Источник
      # пакетов они не закрывают: pip.conf, .npmrc, переменные окружения и
      # вторые источники в самой команде (--extra-index-url, --find-links,
      # npm --registry) уводят установку мимо манифестов, которые читает шаг
      # выше, — и подставленный пакет приедет со своим, сходящимся хэшем.
      # Это первый замок, а не второй (условие гейта к заходу 2 дня 21,
      # ADR 2026-09-29-1639).
      #
      # Зона шага — КАЖДЫЙ файл дерева, кроме .md, .agents/ и node_modules.
      # Именного списка расширений здесь нет намеренно: прежняя редакция
      # читала только Dockerfile, *.sh и workflows/*.yml, и мимо неё проходили
      # setup_env.py, .github/actions/*/action.yml и тот же workflow с
      # расширением .yaml (находки compliance к PR #278). Файлы .md исключены
      # потому, что проза не ставит пакеты: иначе краснели бы ADR и чужой
      # набор .agents/skills/**.
      #
      # АСИММЕТРИЯ, которую видно в выводе шага и которую он не скрывает:
      # Имя команды ищется не по пробелу, а по короткому разделителю
      # (`pip[^A-Za-z0-9_-]{0,8}install`): форма `subprocess.run(["pip",
      # "install", …])` — та же установка, и по пробелу она не находилась.
      # Обратная сторона: шаг краснеет и на строке КОММЕНТАРИЯ с такой
      # командой. Это выбрано осознанно — лучше ложное красное на прозе в
      # исполняемом файле, чем пропуск.
      #   pip — требование ПОЛОЖИТЕЛЬНОЕ: источник ровно один и назван в самой
      #     команде (--index-url https://pypi.org/simple), второй источник
      #     красный. Явный флаг сильнее переменной окружения, поэтому он же
      #     держит и среду раннера, которой в репозитории не видно.
      #   npm — требование только ОТРИЦАТЕЛЬНОЕ: переопределение реестра
      #     краснеет, но умолчание registry.npmjs.org ничем не прибито.
      #     Положительное требование к npm — это правка mcp/Dockerfile,
      #     другая единица и другой PR; обещать его здесь нельзя.
      - name: Реестр пакетов не переопределяется
        run: |
          fail=0
          # 1. Конфигурация реестра файлом: pip и npm читают её сами, и в
          #    манифесте её не видно.
          cfg=$(find . \( -name pip.conf -o -name pip.ini -o -name .npmrc -o -name .netrc -o -name .pydistutils.cfg \) -not -path '*/node_modules/*' -not -path './.git/*' -not -path './.agents/*' | sort)
          if [ -n "$cfg" ]; then
            while IFS= read -r f; do
              echo "::error file=${f#./}::файл задаёт реестр пакетов мимо манифестов — источник обязан стоять в самой команде установки"
            done <<< "$cfg"
            fail=1
          fi
          # Предварительный отбор: файлы, где вообще есть речь об установке
          # или о реестре. Он сужает перебор, а не зону: что не попало сюда,
          # не содержит ни одной из искомых строк.
          candidates=$(grep -rlIE 'pip[^A-Za-z0-9_-]{0,8}install|npm[^A-Za-z0-9_-]{0,8}(ci|install|i)([^A-Za-z0-9_-]|$)|PIP_[A-Z_]*(URL|HOST|LINKS)|NPM_CONFIG_REGISTRY|npm_config_registry|--registry|--index-url|--extra-index-url|--find-links|--trusted-host' --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.agents --exclude='*.md' . || true)
          [ -n "$candidates" ] || { echo "::error::в дереве нет ни одного файла, ставящего пакеты — шаг не проверил ничего"; exit 1; }
          seen=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            seen=$((seen + 1))
            rel=${f#./}
            said_pip=0
            said_npm=0
            # 2. Реестр переменной окружения. Шаблон написан так, что не
            #    находит сам себя: после имени в нём идёт `(`, `|` или `)`,
            #    а не `=` и не `:`. PIP_CONFIG_FILE под него не подпадает —
            #    он реестр не задаёт, а наоборот отключает чтение конфигов.
            hits=$(grep -nE '(PIP_[A-Z_]*(URL|HOST|LINKS)|NPM_CONFIG_REGISTRY|npm_config_registry)[[:space:]]*[=:]' "$f" || true)
            if [ -n "$hits" ]; then
              while IFS= read -r line; do
                echo "::error file=${rel}::переменная уводит реестр пакетов: ${line}"
              done <<< "$hits"
              fail=1
            fi
            # Продолжения строк склеиваются тем же awk, что в шаге выше:
            # флаг может стоять на следующей строке через `\`.
            joined=$(awk '
              { line = buf $0; buf = "" }
              line ~ /\\[ \t]*$/ { sub(/\\[ \t]*$/, "", line); buf = line; next }
              { print line }
              END { if (buf != "") print buf }
            ' "$f")
            while IFS= read -r line; do
              # 3. pip: источник ровно один и назван в команде.
              if [[ $line =~ pip[^A-Za-z0-9_-]{0,8}install ]]; then
                extra=""
                case "$line" in *--extra-index-url*) extra="${extra} --extra-index-url" ;; esac
                case "$line" in *--find-links*) extra="${extra} --find-links" ;; esac
                case "$line" in *--trusted-host*) extra="${extra} --trusted-host" ;; esac
                # Источники СЧИТАЮТСЯ, а не ищутся подстрокой. `--index-url`
                # у pip — опция store, а не накопительная: выигрывает
                # последняя, поэтому «pypi.org где-то в строке» ничего не
                # значит ни при каком порядке флагов (находка compliance к
                # PR #278). `--extra-index-url` в этот счёт не попадает —
                # в нём перед `index-url` один дефис, а не два, — и ловится
                # отдельно веткой выше.
                # `|| true` обязателен: grep без совпадений выходит с 1, а
                # шаг идёт под `-o pipefail`, и присваивание уронило бы его
                # молча — без ::error, то есть с красным без объяснения
                # ровно на том случае, ради которого ветвь и написана
                # (найдено прогоном мутации М10 после введения счёта).
                sources=$( { printf '%s\n' "$line" | grep -oE -- '--index-url' || true; } | wc -l | tr -d ' ')
                if [ -n "$extra" ]; then
                  echo "::error file=${rel}::у установки pip есть второй источник (${extra# }) — pypi.org обязан быть единственным: ${line}"
                  fail=1
                elif [ "$sources" -eq 0 ]; then
                  echo "::error file=${rel}::установка pip без явного «--index-url https://pypi.org/simple»: ${line}"
                  fail=1
                elif [ "$sources" -ne 1 ]; then
                  echo "::error file=${rel}::у установки pip источников ${sources}, а должен быть ровно один: --index-url — опция store, выигрывает последняя: ${line}"
                  fail=1
                else
                  case "$line" in
                    *"--index-url https://pypi.org/simple"*) [ "$said_pip" -eq 1 ] || echo "ok: ${rel} — pip: источник один и назван в команде"; said_pip=1 ;;
                    *) echo "::error file=${rel}::единственный источник установки pip — не «--index-url https://pypi.org/simple»: ${line}"; fail=1 ;;
                  esac
                fi
              fi
              # 4. npm: только отрицательное требование — см. комментарий выше.
              if [[ $line =~ npm[^A-Za-z0-9_-]{0,8}(ci|install|i)([^A-Za-z0-9_-]|$) ]]; then
                case "$line" in
                  *--registry*|*:registry=*) echo "::error file=${rel}::установка npm переопределяет реестр: ${line}"; fail=1 ;;
                  *) [ "$said_npm" -eq 1 ] || echo "ok: ${rel} — npm: переопределения реестра нет (умолчание ничем не прибито)"; said_npm=1 ;;
                esac
              fi
            done <<< "$joined"
          done <<< "$candidates"
          [ "$fail" -eq 0 ] || exit 1
          echo "реестр пакетов ok: просмотрено файлов ${seen}"
      - id: set
        name: Какие дни затронуты
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            # Без -q --verify rev-parse на корневом коммите печатает `HEAD^` в stdout.
            base="$(git rev-parse -q --verify HEAD^ || git rev-list --max-parents=0 HEAD)"
          fi
          # Разбор тот же, что в .github/scripts/deploy-units.sh: тесты на PR
          # выбирают те же единицы, что выкатка для тех же путей, — кроме
          # одного исключения ниже: правка в days/day13, days/day14 или
          # days/day15 поднимает здесь ещё и agents. Исключение только для
          # тестов: службу день не меняет, и лишняя выкатка прод-сервиса —
          # вред, поэтому в deploy-units.sh его нет. Без -z git берёт в кавычки
          # путь с `"`, `\`, табом или не-ASCII, и такой путь не находит свою
          # единицу.
          changed=$(set -o pipefail; git diff -z --name-only "$base" HEAD | tr '\n\0' '?\n') || { echo "::error::git diff ${base}..HEAD упал — затронутые единицы не определены"; exit 1; }
          # Единица сборки — день (days/dayN), сервис (router, agents) или атлас.
          # Граф атласа строится из входов atlas/atlas.config.json: правка любого
          # из них пересобирает атлас, и только его. Версия инструмента живёт в
          # atlas-tool.sh — её смена тоже пересобирает витрину.
          # Корпус индекса — не каталог единицы, а список из rag/corpus.py:
          # правка документа или кода живой единицы обязана переехать в
          # индекс выкаткой, иначе он стареет молча (ADR 2026-09-29-1639,
          # п. 3). Та же роль, что у регулярки atlas ниже.
          # Это ВТОРАЯ копия списка корпуса, и разъехаться ей есть куда:
          # первая редакция забыла README единиц вне списка кода, и правка
          # atlas/README.md меняла бы корпус, не запуская выкатку (находка
          # reviewer к PR #278). Совпадение держит не комментарий, а тест
          # rag/test/test_corpus.py::CiRegexTest — он берёт эту регулярку из
          # ci.yml и прогоняет по ней каждый путь corpus.collect().
          rag='^(agent_docs/|AGENTS\.md$|README\.md$|rag/|router/|agents/|mcp/|mcpnews/|mcpstore/|deploy/|\.github/|test/|atlas/README\.md$|site/README\.md$)'
          atlas='^(atlas/|agent_docs/|\.claude/agents/|\.agents/skills/[^/]+/SKILL\.md$|AGENTS\.md$|skills-lock\.json$|deploy/(compose\.yml|caddy/Caddyfile)$|site/index\.html$|router/config/providers\.json$|\.github/scripts/atlas-tool\.sh$)'
          # Исключение из совпадения с deploy-units.sh: дни 13, 14 и 15 работают
          # через службу агентов, и их связку проверяют тесты из единицы
          # agents — agents/test/day13-reconnect.test.js для дня 13 и
          # agents/test/day14-staged.test.js для дня 14 (там же страж дня 13).
          # День 15 заведён копией дня 14 и ходит в ту же службу, поэтому
          # попадает под то же правило. Без этой строки правка только в
          # days/day13, days/day14 или days/day15 их не прогоняет, и дефект на
          # стыке дня и службы проходит молча (находка reviewer к PR #192). Имя
          # `agents` здесь готовое, из пути ничего не выводится.
          # Имя из пути — недоверенный ввод, оно становится matrix.day: в матрицу
          # идёт только [a-z0-9]+ с каталогом единицы в дереве.
          days=$(printf '%s\n' "$changed" | { grep -oE '^days/[^/]+' | cut -d/ -f2; printf '%s\n' "$changed" | grep -oE '^(router|agents|mcpnews|mcpstore|mcp|rag)/' | cut -d/ -f1; printf '%s\n' "$changed" | grep -qE '^days/day1[345]/' && echo agents; printf '%s\n' "$changed" | grep -qE "$atlas" && echo atlas; printf '%s\n' "$changed" | grep -qE "$rag" && echo rag; } | sort -u | grep -E '^[a-z0-9]+$' | while read -r u; do case $u in (router|agents|atlas|mcpnews|mcpstore|mcp|rag) d=$u ;; (*) d=days/$u ;; esac; [ -d "$d" ] && echo "$u"; done | jq -R . | jq -sc .)
          [ -z "$days" ] && days='[]'
          echo "days=$days" >> "$GITHUB_OUTPUT"
          echo "затронуты: $days"

  test:
    needs: detect
    if: needs.detect.outputs.days != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        day: ${{ fromJSON(needs.detect.outputs.days) }}
    # Имя единицы и производные от него попадают в shell только через env.
    env:
      DAY: ${{ matrix.day }}
    steps:
      # В job исполняется внешний код (инструмент атласа) — токену на диске
      # делать нечего.
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      # Node 24 — тем единицам, что держат состояние во встроенном node:sqlite
      # без флага: сервису агентов и серверу файлов дня 19. Список — здесь, а
      # не в самих единицах: их тесты на Node 22 падают не «не тем», а
      # отсутствием модуля, и читать такой отказ как дефект кода легко.
      - id: node
        name: Версия Node для единицы
        run: |
          case "$DAY" in
            agents|mcpstore) echo "version=24" >> "$GITHUB_OUTPUT" ;;
            *) echo "version=22" >> "$GITHUB_OUTPUT" ;;
          esac
      - uses: actions/setup-node@v4
        with: { node-version: '${{ steps.node.outputs.version }}' }

      - id: unit
        name: Каталог единицы
        run: |
          case "$DAY" in
            router) echo "dir=router" >> "$GITHUB_OUTPUT"; echo "port=8081" >> "$GITHUB_OUTPUT" ;;
            agents) echo "dir=agents" >> "$GITHUB_OUTPUT"; echo "port=8082" >> "$GITHUB_OUTPUT" ;;
            atlas) echo "dir=atlas" >> "$GITHUB_OUTPUT"; echo "port=8080" >> "$GITHUB_OUTPUT" ;;
            mcp) echo "dir=mcp" >> "$GITHUB_OUTPUT"; echo "port=8083" >> "$GITHUB_OUTPUT" ;;
            mcpnews) echo "dir=mcpnews" >> "$GITHUB_OUTPUT"; echo "port=8084" >> "$GITHUB_OUTPUT" ;;
            mcpstore) echo "dir=mcpstore" >> "$GITHUB_OUTPUT"; echo "port=8085" >> "$GITHUB_OUTPUT" ;;
            rag) echo "dir=rag" >> "$GITHUB_OUTPUT"; echo "port=8086" >> "$GITHUB_OUTPUT" ;;
            *) echo "dir=days/$DAY" >> "$GITHUB_OUTPUT"; echo "port=8080" >> "$GITHUB_OUTPUT" ;;
          esac

      # Единственная единица с деревом npm (ADR 2026-09-23-1227, п. 2).
      # Без установки не запустятся её тесты: SDK нужен им на месте.
      # audit — блокирующий, но только когда трогают саму единицу: в матрице
      # mcp появляется лишь при правке mcp/. Красный шаг здесь может значить
      # «реестр недоступен» или «вышло advisory», а не «версия неверна» —
      # читать по agent_docs/guides/verification.md, «Как читать красный прогон».
      - name: Зависимости единицы mcp
        if: matrix.day == 'mcp'
        working-directory: mcp
        run: |
          npm ci --ignore-scripts
          npm audit --omit=dev

      # Единственная единица не на Node (ADR 2026-09-29-1639, п. 2). Версия
      # прибита, а не взята из образа раннера: хэши в rag/requirements.txt —
      # колёс cp312, и на другой версии Python установка откажет не «не тем»,
      # а отсутствием подходящего колеса.
      - uses: actions/setup-python@v5
        if: matrix.day == 'rag'
        with: { python-version: '3.12' }
      # Та же команда, что в rag/Dockerfile: тесты идут против тех же байтов,
      # что поедут в образ.
      - name: Зависимости единицы rag
        if: matrix.day == 'rag'
        working-directory: rag
        env:
          PIP_CONFIG_FILE: /dev/null
        run: |
          pip install --no-cache-dir \
            --index-url https://pypi.org/simple \
            --only-binary=:all: --require-hashes --no-deps \
            -r requirements.txt

      # -print0 и while-read, а не `for f in $(find …)`: имя файла с пробелом
      # или переносом строки разлетелось бы на несколько аргументов (SC2044).
      # Код запоминается, а не обрывает цикл: печатаются все битые файлы, а не
      # первый.
      - name: Синтаксис
        working-directory: ${{ steps.unit.outputs.dir }}
        run: |
          fail=0
          seen=0
          while IFS= read -r -d '' f; do
            seen=$((seen + 1))
            node --check "$f" || fail=1
          done < <(find . -name '*.js' -not -path './node_modules/*' -print0)
          # Второй язык — второй разбор (ADR 2026-09-29-1639, п. 3). corpus/ —
          # копия чужих файлов, собранная шагом ниже, а не код единицы.
          pyseen=0
          while IFS= read -r -d '' f; do
            pyseen=$((pyseen + 1))
            python3 -m py_compile "$f" || fail=1
          done < <(find . -name '*.py' -not -path './corpus/*' -not -path './__pycache__/*' -print0)
          # Пустая выборка у единицы с кодом — не успех: страж, не проверивший
          # ни одного файла, зелёным быть не должен (находка reviewer к PR #225;
          # тот же образец стоит у шага про package.json выше). Проверка идёт
          # по КАЖДОМУ манифесту отдельно: до дня 21 единица с requirements.txt
          # и без .js проходила этот шаг зелёной с notice, то есть без единой
          # проверки кода (условие гейта к заходу 2 ADR 2026-09-29-1639).
          if [ -f package.json ] && [ "$seen" -eq 0 ]; then
            echo "::error::в ${PWD} есть package.json, но ни одного .js — шаг не проверил ничего"
            fail=1
          fi
          if [ -f requirements.txt ] && [ "$pyseen" -eq 0 ]; then
            echo "::error::в ${PWD} есть requirements.txt, но ни одного .py — шаг не проверил ничего"
            fail=1
          fi
          # Граница: единица без манифеста и без кода — это конфигурация и
          # документы (atlas: его app.js генерируемый и в репозиторий не
          # коммитится). Такую пропускаем вслух, а не молча.
          if [ "$seen" -eq 0 ] && [ "$pyseen" -eq 0 ] && [ ! -f package.json ] && [ ! -f requirements.txt ]; then
            echo "::notice::в ${PWD} нет кода и нет манифеста — единица без исполняемого кода, проверять нечего"
          fi
          exit $fail

      - name: Тесты
        working-directory: ${{ steps.unit.outputs.dir }}
        run: |
          ran=0
          if ls test/*.test.js >/dev/null 2>&1 || ls ./*.test.js >/dev/null 2>&1; then
            node --test
            ran=1
          fi
          # Вторая ветвь — по наличию requirements.txt. Пустой прогон
          # `unittest discover` заканчивается кодом 0, поэтому наличие тестов
          # проверяется до запуска, а не по его коду: единица на Python без
          # тестов проходила бы шаг зелёной (условие гейта к заходу 2).
          # Условие шире, чем «есть манифест»: единица на Python может
          # обходиться stdlib и не иметь requirements.txt вовсе, и тогда её
          # тесты пропускались бы молча — у ветви Node такой дыры нет, она
          # включается по наличию тестов (находка reviewer к PR #278).
          if [ -f requirements.txt ] || ls test/test_*.py >/dev/null 2>&1; then
            if ! ls test/test_*.py >/dev/null 2>&1; then
              echo "::error::в ${PWD} есть requirements.txt, но нет test/test_*.py — тестов у единицы нет"
              exit 1
            fi
            python3 -m unittest discover -s test -t .
            ran=1
          fi
          if [ "$ran" -eq 0 ]; then
            echo "тестов нет — пропуск"
          fi

      # В образ атласа идёт собранный atlas/dist/site, поэтому сборка — до docker build.
      # Инструмент — клон project-atlas на пине из atlas-tool.sh (ADR 2026-09-12-0440).
      - name: Сборка витрины атласа
        if: matrix.day == 'atlas'
        run: |
          ATLAS_TOOL=$(bash .github/scripts/atlas-tool.sh)
          node "$ATLAS_TOOL/build.js" --root . --config atlas/atlas.config.json --out atlas/dist

      # В образ rag идёт копия корпуса, поэтому сборка — до docker build, как
      # у атласа (ADR 2026-09-12-0440 — прецедент; ADR 2026-09-29-1639, п. 3).
      # Список корпуса живёт в rag/corpus.py, а не здесь: тот же обход читает
      # build.py, и разъехаться им негде. Репозиторий в контейнер не
      # монтируется — рядом с ним на VPS лежат deploy/*.env.
      - name: Сборка корпуса для индекса
        if: matrix.day == 'rag'
        run: python3 rag/corpus.py --root . --out rag/corpus

      - name: Сборка образа (без публикации)
        env:
          DIR: ${{ steps.unit.outputs.dir }}
        run: docker build -t "ci-check:$DAY" "$DIR"

      - name: Контейнер поднимается и отвечает на /healthz
        env:
          PORT: ${{ steps.unit.outputs.port }}
        run: |
          # Имя из одного символа docker больше не принимает.
          # Ключ фиктивный: проверяем, что контейнер поднимается и отвечает,
          # а не что конфигурация полна — /healthz отдаёт 503 без ключа.
          # Роутеру для старта нужны ключи приложений — тоже фиктивные.
          # Сервису агентов — AGENT_KEY и ROUTER_APP_KEY, дню 6 — AGENT_KEY.
          #
          # RAG_KEY — не «на всякий случай»: единица rag БЕЗ него выходит с
          # кодом 2 и до /healthz не доходит вовсе (rag/serve.py, main; ADR
          # 2026-09-29-2139, п. 1). То есть эта строка — не ослабление
          # проверки, а условие того, чтобы шаг проверял свой предмет:
          # снимите её — и шаг покраснеет на rag, что и случилось в PR #282.
          docker run -d --name ci-day -e ANTHROPIC_API_KEY=ci-dummy \
            -e GROQ_API_KEY=ci-dummy -e KIMI_API_KEY=ci-dummy \
            -e ROUTER_ADMIN_KEY=ci-dummy -e APP_KEY_SMOKE=ci-dummy \
            -e APP_KEY_DAY5=ci-dummy -e APP_KEY_AGENTS=ci-dummy \
            -e ROUTER_APP_KEY=ci-dummy -e AGENT_KEY=ci-dummy \
            -e MCP_KEY=ci-dummy -e RAG_KEY=ci-dummy \
            -p "$PORT:$PORT" "ci-check:$DAY"
          for _ in $(seq 1 20); do
            if curl -fsS "http://127.0.0.1:$PORT/healthz" >/dev/null 2>&1; then
              echo "healthz ok"; docker rm -f ci-day; exit 0
            fi
            sleep 1
          done
          echo "::error::контейнер не ответил на /healthz за 20 с"
          # Пустой лог сам по себе ничего не говорит: печатаем и состояние.
          docker ps -a --filter name=ci-day
          docker inspect --format 'status={{.State.Status}} exit={{.State.ExitCode}} err={{.State.Error}}' ci-day || true
          docker logs ci-day 2>&1 | tail -40
          docker rm -f ci-day; exit 1

  caddyfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Проверка Caddyfile
        run: docker run --rm -v "$PWD/deploy/caddy:/w" -w /w caddy:2-alpine caddy validate --config Caddyfile

      # Предмет шага — не синтаксис файла, а то, что правка файла доезжает до
      # живого процесса Caddy тем же способом, каким это делает выкатка:
      # обновление репозитория заменяет файл новым inode, после чего идёт
      # `caddy reload` в уже работающем контейнере.
      #
      # Зачем живым прогоном, а не чтением compose.yml. Что монтируется
      # каталог, держит test/caddy-mount.test.js — он читает текст. Но из
      # текста не следует, что монтировка каталога действительно показывает
      # контейнеру новое содержимое: это свойство монтирования и образа, а не
      # нашего файла, и сменить его может обновление caddy или докера на
      # раннере, не тронув ни одной нашей строки. Поэтому здесь поднимается
      # настоящий образ.
      #
      # Вторая половина шага — приманка: тот же прогон на ПРЕЖНЕЙ монтировке
      # одиночным файлом обязан отдать ПРЕЖНЕЕ содержимое при успешном
      # `reload`. Без неё шаг оставался бы зелёным и в мире, где обе
      # монтировки работают одинаково, то есть не различал бы гипотезы и не
      # доказывал бы ничего про дефект.
      - name: Правка Caddyfile доезжает до живого входа
        timeout-minutes: 5
        run: bash .github/scripts/caddy-mount-check.sh

  # Границы сетей compose — условие вето compliance (ADR 2026-09-23-1227,
  # п. 5, заменён в части ADR 2026-09-29-0236). Проверяет структуру
  # deploy/compose.yml, а не намерение: mcp только в сети mcp, в сети mcp —
  # caddy, mcp, день 16 и agents, причём agents обязан там быть (иначе хост
  # не дотянется до службы дня 16); cron только в сети cron, в сети cron —
  # только agents и cron (ADR 2026-09-28-0736, п. 6).
  # Отрезанной от agents сеть mcp больше НЕ является: достижимость службы
  # дня 16 держит ключ MCP_KEY, а не топология.
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Изоляция сетей mcp и cron
        run: node .github/scripts/compose-networks.mjs

      # Потолки памяти и ядер у ollama и rag — ADR 2026-09-29-1639, п. 4.
      # Отдельным шагом от изоляции сетей: это разные правила и разные отказы.
      # Сверяются точные значения, а не «потолок есть»: `mem_limit: 8g` — тоже
      # потолок, только на машине с 3,9 ГБ он ничего не значит.
      - name: Потолки памяти и ядер у ollama и rag
        run: node .github/scripts/compose-limits.mjs

      # Контейнер времени — стоковый образ без Dockerfile, поэтому ни матрица
      # сборки, ни «Проверка живого сайта» его не видят: до первого срока в
      # проде о нём никто ничего не узнает. Этот шаг — единственное место, где
      # образ поднимается до выкатки.
      #
      # Проверяется не «образ существует», а три допущения, на которых стоит
      # п. 6 ADR и которые до сборки были взяты из конфигурации busybox, а не
      # из прогона:
      #   1) в образе есть crond и wget с длинными опциями (--post-data,
      #      --header) — иначе тик не уйдёт вовсе;
      #   2) локальное время образа — UTC, то есть в нём нет tzdata. Сдвиг
      #      развёл бы сутки расписания и сутки суточного потолка стартов, не
      #      сломав при этом ничего на вид: контейнер жив, запуски идут;
      #   3) настоящий deploy/cron/entrypoint.sh с этим образом доходит до
      #      crond — берётся файл из репозитория, а не его пересказ;
      #   4) таблица, которую busybox awk собрал из agents/config/jobs.json,
      #      совпадает со строками, посчитанными из того же файла node через
      #      JSON.parse. Это и есть держатель единственного источника
      #      каденции: строчный разбор в alpine и разбор JSON в сервисе
      #      агентов обязаны понимать одну строку одинаково. Сверка идёт по
      #      журналу поднятого контейнера, а не по выводу скрипта на раннере:
      #      предмет — что до alpine доехало именно это.
      #
      # Образ берётся строкой из deploy/compose.yml, а не повторяется здесь:
      # иначе шаг проверял бы один образ, а прод поднимал другой, и обновление
      # пина оставляло бы шаг зелёным.
      # timeout-minutes — страховка на всё остальное в шаге (docker pull,
      # apk add): ограничение снаружи shell, которое не зависит ни от одной
      # гипотезы о поведении процессов внутри контейнера.
      - name: Образ cron умеет crond и wget --post-data
        timeout-minutes: 10
        run: |
          set -euo pipefail
          image=$(grep -oE 'alpine:[0-9.]+@sha256:[0-9a-f]{64}' deploy/compose.yml)
          [ -n "$image" ] || { echo "::error::в deploy/compose.yml не найден образ cron, закреплённый по digest"; exit 1; }
          echo "образ из compose.yml: $image"
          docker pull -q "$image"

          # Наличие crond — по `command -v`, а не по тексту справки: у
          # отсутствующей команды вывод «sh: crond: not found» тоже содержит
          # слово crond, и проверка по тексту зеленела бы на любой гипотезе.
          docker run --rm --entrypoint /bin/sh "$image" -c 'command -v crond >/dev/null' || {
            echo "::error::в образе нет crond"; exit 1; }

          # А вот длинные опции wget видны только в справке: busybox собирают и
          # без CONFIG_FEATURE_WGET_LONG_OPTIONS, и тогда wget есть, а
          # --post-data нет. Справка идёт в stderr с ненулевым кодом — отсюда
          # `|| true` и разбор текста.
          help=$(docker run --rm --entrypoint /bin/sh "$image" -c 'wget --help 2>&1' || true)
          printf '%s\n' "$help" | grep -q 'post-data' || {
            echo "::error::в образе нет wget --post-data: тик планировщика не уйдёт"; exit 1; }

          offset=$(docker run --rm --entrypoint /bin/sh "$image" -c 'date +%z')
          [ "$offset" = '+0000' ] || {
            echo "::error::локальное время образа $offset, а не UTC: сутки расписания разойдутся с сутками суточного потолка стартов"; exit 1; }
          echo "смещение времени в образе: $offset"

          # ── Предел сверху для запусков entrypoint.sh ────────────────────
          # entrypoint.sh в норме заканчивается `exec crond -f`, который сам
          # не завершается, поэтому у каждого его запуска обязан быть предел.
          # Раньше предел стоял ВНУТРИ контейнера (`--entrypoint
          # /usr/bin/timeout … 10`), и шаг всё равно встал на 16 минут
          # (прогон 36401908047, job 108861506729): контейнер был жив спустя
          # 16 минут после предела в 10 секунд. Причина установлена прогоном
          # (36404323513, три запуска, отличавшиеся только тем, кто PID 1):
          # busybox timeout не форкает ребёнка, а ставит сторожа и exec'ает
          # команду в своём же процессе. С `--entrypoint /usr/bin/timeout`
          # этот процесс — PID 1, значит PID 1 становится crond, а ядро не
          # доставляет PID 1 сигнал без своего обработчика. crond обработчика
          # TERM не ставит — сторож стрелял в пустоту.
          #   A: timeout как entrypoint, цель = PID 1 → не умер, 124 по
          #      пределу раннера;
          #   B: та же команда, но PID 1 = /bin/sh → 143 за 3 с;
          #   C: timeout как entrypoint, но PID 1 = docker-init → 143 за 3 с.
          #
          # Отсюда правка: предел вынесен НАРУЖУ контейнера, где PID 1
          # контейнера роли не играет. Контейнер поднимается фоном, ждёт его
          # сам шаг своим счётчиком (docker logs и docker inspect
          # возвращаются сразу), а снимает `docker rm -f` — это KILL, а KILL
          # не игнорирует даже PID 1. Не снимать как лишнее: без внешнего
          # предела любой незавершающийся процесс в образе снова вешает job
          # до лимита GitHub в 6 часов.
          #
          # «Не уложился в предел» — отдельный красный со своим текстом, а не
          # тихий `|| true`: иначе зависание маскировалось бы под невыполненную
          # проверку, а ждать, чем кончится, было бы нечем.
          wait_s=20

          # Первый запуск: настоящий entrypoint на настоящем образе должен
          # дойти до строки «расписание принято, запуск crond». Предмет проверки —
          # что до неё дошло, а не что процесс закончился: после неё crond
          # работает вечно, и ждать его выхода бессмысленно. Ключ здесь
          # заведомо не настоящий: шаг никуда не стучится.
          docker rm -f ci-cron-start >/dev/null 2>&1 || true
          docker run -d --name ci-cron-start -e AGENT_KEY=ci-not-a-real-key \
            -v "$PWD/deploy/cron:/cron:ro" \
            -v "$PWD/agents/config/jobs.json:/jobs.json:ro" --entrypoint /bin/sh \
            "$image" /cron/entrypoint.sh >/dev/null

          # Три исхода ожидания различимы, и каждый разбирается отдельно:
          # строка появилась; контейнер завершился, не напечатав её; предел
          # вышел, а контейнер всё ещё жив.
          started=no
          exited=no
          i=0
          while [ "$i" -lt "$wait_s" ]; do
            if docker logs ci-cron-start 2>&1 | grep -q 'расписание принято, запуск crond'; then
              started=yes
              break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' ci-cron-start)" != 'true' ]; then
              exited=yes
              break
            fi
            i=$((i + 1))
            sleep 1
          done
          rc=$(docker inspect -f '{{.State.ExitCode}}' ci-cron-start)
          echo "--- журнал первого запуска ---"
          docker logs ci-cron-start > /tmp/cron-start.log 2>&1 || true
          cat /tmp/cron-start.log
          echo "--- конец журнала первого запуска ---"
          docker rm -f ci-cron-start >/dev/null
          if [ "$started" != 'yes' ] && [ "$exited" = 'yes' ]; then
            echo "::error::deploy/cron/entrypoint.sh завершился кодом $rc, не дойдя до crond на этом образе — журнал выше"
            exit 1
          fi
          if [ "$started" != 'yes' ]; then
            echo "::error::за ${wait_s} с контейнер не напечатал «расписание принято, запуск crond» и остался жив: шаг не дождался, проверка старта не выполнена — журнал выше"
            exit 1
          fi
          echo "первый запуск: entrypoint дошёл до crond"

          # ── Таблица в контейнере = каденция из jobs.json ────────────────
          # Ожидаемые строки считает node из того же файла разбором JSON —
          # тем самым, которым его читает сервис агентов. Сверка не с
          # выводом deploy/cron/crontab.sh на раннере, а со строками
          # «cron:   …» из журнала контейнера: именно они доказывают, что
          # busybox awk в alpine понял файл так же.
          # shellcheck disable=SC2016 # ${…} здесь — шаблон JS, а не подстановка shell
          node -e '
            const jobs = JSON.parse(require("fs").readFileSync("agents/config/jobs.json", "utf8")).jobs
            if (!Array.isArray(jobs) || jobs.length === 0) { console.error("::error::в jobs.json нет работ"); process.exit(1) }
            process.stdout.write(jobs.map((j) => `${j.scheduleUtc} /cron/tick.sh ${j.id}`).join("\n") + "\n")
          ' > /tmp/expected-crontab
          echo "--- ожидаемая таблица по jobs.json ---"
          cat /tmp/expected-crontab

          # Строки таблицы — из журнала, снятого выше: контейнер уже снят,
          # а отметка о приёме печатается ПОСЛЕ таблицы, поэтому в журнале
          # она полная.
          sed -n 's/^cron:   //p' /tmp/cron-start.log > /tmp/actual-crontab
          if ! diff -u /tmp/expected-crontab /tmp/actual-crontab; then
            echo "::error::таблица crond в контейнере разошлась с каденцией из agents/config/jobs.json — слева ожидаемое по JSON.parse, справа напечатанное контейнером"
            exit 1
          fi
          echo "таблица crond в контейнере совпала с jobs.json"

          # Отказ по поясу — устройство, и проверяется он подменой пояса, а не
          # чтением комментария. Коды различают гипотезы: без них «не удалось
          # поставить tzdata» и «пояс сменился, а entrypoint всё равно
          # поднялся» дали бы один и тот же ненулевой код, и шаг зеленел бы
          # при любом исходе (agent_docs/guides/verification.md).
          #   90 — tzdata не встала: мутация не состоялась, судить не о чем;
          #   91 — пояс не сменился: мутация не состоялась;
          #   78 — entrypoint отказал по поясу, как и задумано.
          # Здесь ждут именно завершения: отказ обязан быть выходом. Но если
          # отказа нет, контейнер уходит в crond и не кончается никогда —
          # отсюда тот же внешний предел, что и у первого запуска, и свой
          # красный на «не дождались».
          docker rm -f ci-cron-tz >/dev/null 2>&1 || true
          docker run -d --name ci-cron-tz -e AGENT_KEY=ci-not-a-real-key -e TZ=Asia/Singapore \
            -v "$PWD/deploy/cron:/cron:ro" \
            -v "$PWD/agents/config/jobs.json:/jobs.json:ro" --entrypoint /bin/sh "$image" -c \
            'apk add --no-cache tzdata >/dev/null 2>&1 || exit 90; [ "$(date +%z)" = "+0800" ] || exit 91; exec /bin/sh /cron/entrypoint.sh' >/dev/null
          exited=no
          i=0
          while [ "$i" -lt "$wait_s" ]; do
            if [ "$(docker inspect -f '{{.State.Running}}' ci-cron-tz)" != 'true' ]; then
              exited=yes
              break
            fi
            i=$((i + 1))
            sleep 1
          done
          rc=$(docker inspect -f '{{.State.ExitCode}}' ci-cron-tz)
          echo "--- журнал запуска с поясом Asia/Singapore ---"
          docker logs ci-cron-tz 2>&1 || true
          echo "--- конец журнала запуска с поясом ---"
          docker rm -f ci-cron-tz >/dev/null
          if [ "$exited" != 'yes' ]; then
            echo "::error::за ${wait_s} с контейнер с поясом +0800 не завершился: шаг не дождался, отказ по поясу не проверен — журнал выше"
            exit 1
          fi
          case "$rc" in
            78) echo "пояс Asia/Singapore: старт отменён кодом 78, как и задумано" ;;
            90) echo "::error::tzdata не поставилась — подмена пояса не состоялась, отказ по поясу не проверен"; exit 1 ;;
            91) echo "::error::пояс не сменился — подмена пояса не состоялась, отказ по поясу не проверен"; exit 1 ;;
            *) echo "::error::при поясе +0800 entrypoint вернул $rc, а не 78: отказ по поясу не держит"; exit 1 ;;
          esac


  # actionlint по всем workflow: синтаксис, выражения ${{ }}, имена событий,
  # и shellcheck по телам `run:` (ADR 2026-09-24-1230, A10).
  #
  # ЧТО ЭТОТ ШАГ НЕ ЛОВИТ: `curl … || echo 000` и прочие «подстраховки», из-за
  # которых упавшая команда даёт зелёный результат, — для shellcheck это
  # корректный код, и он молчит. Дефекты этого класса ловит только мутация,
  # прогнанная автором («Красная ветвь» в описании PR). У шага не должно быть
  # репутации проверки семантики: он проверяет форму.
  #
  # Версия образа закреплена: новый релиз линтера не должен краснить CI сам по
  # себе — обновление отдельным PR, как у любого другого пина.
  actionlint:
    runs-on: ubuntu-latest
    steps:
      # persist-credentials: false и монтаж :ro — в job исполняется внешний
      # образ, токену на диске делать нечего, и писать в дерево ему незачем.
      # Правило то же, что у соседнего docs-guard (находка reviewer к PR #225).
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Линт workflow (actionlint + shellcheck по run:)
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint:1.7.12 -color

  # Единая обязательная проверка для защиты ветки: имя check run — id job.
  # skipped (test при пустой матрице) — успех; failure или cancelled — провал.
  ci-ok:
    needs: [detect, test, caddyfile, compose, actionlint]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Итог зависимостей
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "detect/test/caddyfile/compose/actionlint: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) echo "::error::есть failure или cancelled"; exit 1 ;;
          esac
